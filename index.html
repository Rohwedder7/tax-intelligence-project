<script id="app-data" type="application/json">{"schemaVersion":1,"documentId":"9c1c303c-7eed-412f-833d-7c64158b1e4f","revision":732,"updatedAt":"2026-10-16T16:20:01.488Z","projects":[{"id":"38d644b4-e85a-41f6-acba-4ee208f034aa","name":"Tax Data Hub","area":"Tax Intelligence","owner":"Willian Rohvedder","sponsor":"Marcia Janeiro","description":"Desenvolver e implementar o **Tax Data Hub**, uma plataforma web corporativa, construída sobre o framework GAIA, destinada à centralização, automação, governança e inteligência dos processos tributários da companhia.\n\nA solução contará com integração de Inteligência Artificial Generativa (LLM), permitindo análises avançadas de dados fiscais, identificação de inconsistências, geração de insights, análises preditivas e suporte à tomada de decisões estratégicas.\n\n**O escopo contempla:**\n\n- **Conciliação tributária:** automatização de conciliações fiscais e contábeis, identificação de divergências e acompanhamento de saldos e pendências.\n- **Tax Intelligence:** análise de dados tributários com apoio de IA, identificação de riscos, oportunidades e geração de recomendações.\n- **Análise preditiva:** utilização de dados históricos e modelos analíticos para projeções tributárias, identificação de tendências e antecipação de riscos.\n- **Reforma Tributária:** módulo dedicado ao IBS e à CBS, contemplando acompanhamento, análises, conciliações e controles relacionados à implementação do novo modelo tributário.\n- **Governança e Compliance:** centralização de indicadores, controles, dashboards gerenciais, trilhas de auditoria e acompanhamento dos processos fiscais.\n- **Integração de dados:** estruturação de integrações com sistemas corporativos, incluindo SAP, soluções fiscais e demais fontes de informações tributárias.\n\nO projeto busca aumentar a eficiência operacional, reduzir atividades manuais e riscos fiscais, fortalecer a governança dos dados e transformar a área tributária em uma estrutura mais estratégica, automatizada e orientada por dados.","status":"Planejado","priority":"Alta","start":"2026-10-19","end":"2027-03-31","completedDate":"","plannedHours":350,"baseHours":15,"baseCost":0,"hourlyRate":0,"hourCostEnabled":false,"savingsMethod":"O ganho de produtividade será obtido por meio da centralização e automação dos processos tributários, eliminando atividades manuais de extração, consolidação, tratamento, conciliação e análise de dados fiscais e contábeis.\n\nA plataforma Tax Data Hub permitirá executar conciliações automatizadas, identificar divergências, gerar relatórios gerenciais e realizar análises tributárias com apoio de Inteligência Artificial (LLM), reduzindo o tempo operacional necessário para execução dessas atividades.\n\n**Memória de cálculo – Estimativa preliminar:**\n\n- Conciliações tributárias: redução estimada de 80 para 24 horas/mês = 672 horas/ano.\n- Extração, tratamento e consolidação de dados: redução de 40 para 12 horas/mês = 336 horas/ano.\n- Análises tributárias e identificação de divergências: redução de 40 para 16 horas/mês = 288 horas/ano.\n- Elaboração de relatórios e indicadores gerenciais: redução de 24 para 8 horas/mês = 192 horas/ano.\n- Monitoramento e controles relacionados à Reforma Tributária: redução de 32 para 16 horas/mês = 192 horas/ano.\n\n**Ganho total estimado: 1.680 horas/ano**, equivalente a uma redução aproximada de 65% no esforço operacional das atividades consideradas.\n\nOs valores representam projeções iniciais, sujeitas à validação por meio do levantamento dos tempos atuais (baseline) e da mensuração dos resultados após a implantação de cada módulo, evitando a contabilização duplicada de benefícios.","budget":null,"benefits":"O Tax Data Hub proporcionará ganhos operacionais, estratégicos e de governança, impulsionando a transformação digital da área tributária.\n\n**Principais benefícios:**\n\n- **Eficiência operacional:** redução de atividades manuais e repetitivas, aumentando a produtividade e a capacidade de execução da equipe tributária.\n- **Mitigação de riscos fiscais:** identificação antecipada de inconsistências, divergências tributárias e potenciais exposições fiscais.\n- **Inteligência tributária:** utilização de IA generativa e análises preditivas para apoiar decisões, identificar tendências, oportunidades e riscos.\n- **Centralização das informações:** consolidação dos processos, indicadores e dados tributários em uma única plataforma corporativa.\n- **Governança e rastreabilidade:** padronização dos controles, histórico das análises, trilhas de auditoria e maior transparência das informações.\n- **Preparação para a Reforma Tributária:** fortalecimento do acompanhamento e controle das operações relacionadas ao IBS e à CBS.\n- **Escalabilidade:** estrutura tecnológica baseada no framework GAIA, permitindo evolução contínua e incorporação de novos módulos e processos.\n\nA iniciativa permitirá direcionar parte significativa da capacidade operacional da equipe para atividades de maior valor agregado, fortalecendo o papel estratégico da área tributária na companhia.","expectedResults":"Espera-se implementar uma plataforma corporativa integrada, segura e escalável, capaz de centralizar os principais processos tributários e ampliar a utilização de automação e inteligência artificial na área fiscal.\n\n**Indicadores e critérios de sucesso propostos:**\n\n1. **Produtividade:** alcançar redução de aproximadamente 65% do esforço operacional nas atividades contempladas, com potencial estimado de economia de 1.680 horas/ano.\n2. **Automação:** automatizar pelo menos 80% das rotinas repetitivas priorizadas no escopo do projeto.\n3. **Centralização:** disponibilizar em uma única plataforma os módulos de conciliação tributária, Tax Intelligence, Reforma Tributária e dashboards gerenciais, conforme roadmap aprovado.\n4. **Qualidade e confiabilidade:** garantir rastreabilidade das informações e validação dos resultados automatizados em comparação com os processos e controles fiscais existentes.\n5. **Inteligência Artificial:** implementar integração funcional com LLM para consultas, análises de dados tributários, identificação de inconsistências e geração de insights, com validação humana para conclusões fiscais relevantes.\n6. **Governança e segurança:** implementar controles de acesso, histórico de operações, monitoramento e mecanismos de proteção das informações corporativas.\n7. **Adoção da solução:** alcançar utilização recorrente da plataforma pelos usuários-chave dos processos contemplados.\n\n**Validação dos resultados:** os indicadores serão acompanhados por meio de comparativos entre os tempos de execução anteriores e posteriores à implementação, relatórios de utilização, testes de homologação, evidências das conciliações automatizadas e acompanhamento periódico dos benefícios efetivamente realizados.","annualHours":1680,"annualMoney":null,"attention":"Os principais pontos de atenção para a implementação do Tax Data Hub estão relacionados à integração tecnológica, qualidade dos dados, segurança da informação, governança e adoção da solução.\n\n1. **Integração com sistemas corporativos:** garantir a viabilidade técnica das integrações com SAP, MasterSAF e demais fontes de dados tributários, considerando disponibilidade de APIs, permissões e dependências do time de IT.\n\n2. **Qualidade e integridade dos dados:** assegurar a consistência, padronização e confiabilidade das informações fiscais e contábeis utilizadas nas conciliações, análises e modelos de inteligência artificial.\n\n3. **Segurança da informação:** garantir conformidade com as políticas corporativas de segurança, LGPD, segregação de acessos e proteção de informações tributárias sensíveis, incluindo autenticação corporativa via Active Directory/Entra ID.\n\n4. **Governança da Inteligência Artificial:** estabelecer critérios de validação das respostas da LLM, prevenindo interpretações tributárias incorretas, exposição indevida de dados e utilização de informações não confiáveis. As decisões fiscais relevantes deverão permanecer sujeitas à validação humana.\n\n5. **Aderência ao framework GAIA:** assegurar que o desenvolvimento siga os padrões corporativos de arquitetura, infraestrutura, segurança, autenticação e implantação estabelecidos pelo framework.\n\n6. **Complexidade das regras tributárias:** considerar as particularidades das legislações estaduais e federais, alterações normativas frequentes e atualizações decorrentes da Reforma Tributária (IBS/CBS).\n\n7. **Priorização e controle do escopo:** estruturar o desenvolvimento em fases, priorizando funcionalidades de maior impacto operacional e evitando crescimento descontrolado do escopo e atrasos na implantação.\n\n8. **Disponibilidade de recursos:** garantir participação das equipes de Tax e IT para definição de requisitos, disponibilização de acessos, desenvolvimento, testes e homologação.\n\n9. **Desempenho e escalabilidade:** assegurar capacidade de processamento de grandes volumes de documentos fiscais e contábeis, mantendo desempenho adequado nas conciliações e análises automatizadas.\n\n10. **Mensuração dos benefícios:** estabelecer indicadores e uma linha de base dos processos atuais para comprovar os ganhos de produtividade, evitando sobreposição na contabilização das horas economizadas.\n\n**Mitigação dos riscos:** realizar avaliação técnica inicial com IT, homologações por módulo, validações tributárias com usuários-chave, implementação de controles de segurança e acompanhamento periódico dos marcos do projeto.","nextSteps":"1. **Planejamento e arquitetura:** alinhamento com o time de IT para definição da infraestrutura, arquitetura técnica, requisitos de segurança e estrutura de desenvolvimento utilizando o framework GAIA.\n\n2. **Levantamento de requisitos:** mapeamento dos processos tributários, fontes de dados, regras de negócio, integrações necessárias e definição dos requisitos funcionais de cada módulo.\n\n3. **Priorização do desenvolvimento:** definição do MVP, cronograma de implementação e planejamento das entregas evolutivas, considerando o impacto operacional e os benefícios esperados.\n\n4. **Desenvolvimento da plataforma:** construção da aplicação web, estruturação do banco de dados, interfaces, dashboards, funcionalidades de conciliação e módulos tributários.\n\n5. **Implementação da Inteligência Artificial:** integração da LLM, desenvolvimento das funcionalidades de análise inteligente e estruturação dos modelos de análise preditiva, com controles de segurança e governança.\n\n6. **Integrações corporativas:** implementação e validação das conexões com SAP e demais sistemas e bases de dados tributários.\n\n7. **Testes e homologação:** execução de testes funcionais, validação dos cálculos e análises tributárias, avaliação de segurança e homologação das funcionalidades com os usuários-chave.\n\n8. **Implantação e evolução contínua:** disponibilização da solução em ambiente produtivo, capacitação dos usuários, monitoramento dos resultados e evolução gradual dos módulos conforme o roadmap definido.","milestones":[{"id":"38032c42-19b1-48cd-9015-185c0bdeb7cf","title":"Apresentação do projeto para CFO e diretoria","due":"2027-10-14","owner":"Willian Rohvedder","done":true,"updatedAt":"2026-10-16T16:19:29.687Z","description":"","result":"","evidence":"","completedDate":"","linkedUpdateId":""}],"risks":[],"updates":[{"id":"704d0c75-7e3d-47ea-8cad-626734184ed3","week":"2026-10-12","summary":"Apresentação realizada para o Bernardo das iniciativas de Tax Intelligence, no entanto, focamos no Tax Data Hub.\n\nApresentamos a Idéia do projeto e agora iniciaremos o seu desenvolvimento.","achievements":"Repositório do Github aberto pelo time de DevOps da GDM","attention":"","nextSteps":"Seguir com o desenvolvimento no Figma do frontend e depois migrar para o framework GAIA.","hours":1,"expenses":0,"health":"No ritmo","author":"Willian Rohvedder","updatedAt":"2026-10-16T16:20:01.488Z","date":"2026-10-14"}],"createdAt":"2026-10-16T13:29:25.504Z","updatedAt":"2026-10-16T16:20:01.488Z"},{"id":"cb258a87-1cd4-46bd-ab35-8dbf1e35ddd7","name":"Reforma Tributária","area":"Tax Intelligence","owner":"Willian Rohvedder","sponsor":"Marcia Janeiro","description":"Garantir a adequação integral dos processos tributários, operacionais, fiscais e contábeis da GDM às exigências legais da Reforma Tributária sobre o Consumo, assegurando o cumprimento das obrigações estabelecidas pelo Governo Federal e demais administrações tributárias, bem como a continuidade das operações da companhia a partir de janeiro de 2027.\n\nO projeto contempla a implementação das alterações necessárias nos sistemas SAP, MasterSAF, Tax One e demais soluções integradas, abrangendo emissão e recebimento de documentos fiscais, determinação tributária, contabilização, apuração, controles e adequação das operações aos novos tributos IBS e CBS.\n\n**Evolução já alcançada:** a GDM avançou na implementação dos requisitos aplicáveis a 2026, incluindo a emissão de documentos fiscais com as informações de IBS e CBS e seus respectivos destaques estatísticos, conforme as regras aplicáveis ao período.\n\n**Escopo prioritário para conclusão até 31/12/2026:** implementar e homologar as funcionalidades previstas nas Waves 1, 2 e 3 do roadmap corporativo, incluindo contranotas, diferimento e redução tributária, DFe Governance, documentos fiscais de serviço, notas de débito e crédito, eventos fiscais, contabilização de IBS/CBS, extinção do PIS/COFINS, alteração do tratamento estatístico da CBS e demais adequações exigidas para 2027.\n\nO objetivo central não é a geração de ganhos financeiros ou redução de horas, mas o atendimento às obrigações legais, a mitigação de riscos fiscais e a garantia de que os processos de faturamento, compras, recebimento, contabilização e apuração continuem operando corretamente no novo ambiente tributário.","status":"Em desenvolvimento","priority":"Crítica","start":"2025-10-01","end":"2026-12-31","completedDate":"2027-01-01","plannedHours":null,"baseHours":0,"baseCost":0,"hourlyRate":0,"hourCostEnabled":false,"savingsMethod":"**Não aplicável – Projeto de natureza regulatória e atendimento à obrigação legal.**\n\nO projeto de Reforma Tributária não possui como objetivo principal a redução de horas operacionais, a geração de economia financeira ou a obtenção de retorno sobre investimento.\n\nSua execução é necessária para garantir o atendimento às exigências legais relacionadas à implementação do IBS e da CBS, incluindo a adequação de sistemas, processos fiscais, documentos eletrônicos e registros contábeis.\n\nA não implementação das alterações obrigatórias dentro dos prazos estabelecidos poderá resultar em operações fiscais em desconformidade, rejeições de documentos eletrônicos, inconsistências na determinação dos tributos, exposição a penalidades e riscos de interrupção operacional.\n\nDessa forma, o benefício do projeto será mensurado prioritariamente pelo cumprimento das exigências legais, pela conclusão das adequações sistêmicas e pela capacidade de operar em conformidade com a legislação a partir de janeiro de 2027.\n\nEventuais ganhos operacionais decorrentes das implementações serão considerados benefícios secundários, sem compromisso de redução de horas neste projeto.","budget":null,"benefits":"O principal benefício do projeto é assegurar a conformidade legal e a continuidade das operações da GDM diante das mudanças obrigatórias estabelecidas pela Reforma Tributária brasileira.\n\n**Benefícios esperados:**\n\n- **Atendimento legal:** garantir que as operações fiscais, contábeis e comerciais estejam adequadas à legislação vigente e às obrigações aplicáveis ao IBS e à CBS.\n- **Continuidade operacional:** assegurar que os processos de faturamento, compras, recebimento de mercadorias e serviços, contabilização e apuração funcionem corretamente a partir de janeiro de 2027.\n- **Mitigação de riscos fiscais:** reduzir a exposição a penalidades, autuações, inconsistências fiscais e rejeições de documentos eletrônicos decorrentes da não conformidade.\n- **Segurança na transição tributária:** preparar os sistemas e processos para a substituição do PIS/COFINS pela CBS e para as demais alterações previstas no cronograma legal.\n- **Integridade dos processos fiscais e contábeis:** garantir consistência entre os documentos fiscais emitidos e recebidos, cálculos tributários, lançamentos contábeis e informações disponibilizadas ao Fisco.\n- **Adequação das operações da GDM:** assegurar o correto tratamento tributário das operações específicas da companhia, considerando seus produtos, atividades e particularidades fiscais.\n- **Governança regulatória:** estabelecer mecanismos de acompanhamento das alterações legais, validação das implementações e documentação dos processos.\n\nO projeto representa uma necessidade obrigatória de adequação legal, sendo fundamental para preservar a regularidade fiscal e a continuidade dos negócios da companhia.","expectedResults":"O principal resultado esperado é garantir que, até 31/12/2026, a GDM tenha implementado e homologado todos os requisitos legais e sistêmicos obrigatórios para operar em conformidade com a Reforma Tributária a partir de 01/01/2027.\n\n**Critérios de sucesso:**\n\n1. **Conclusão do roadmap:** finalizar 100% das entregas obrigatórias previstas nas Waves 1, 2 e 3 para a operação de 2027.\n2. **Adequação sistêmica:** garantir que SAP, MasterSAF, Tax One e demais sistemas impactados estejam parametrizados e integrados conforme os requisitos legais aplicáveis.\n3. **Conformidade dos documentos fiscais:** assegurar a emissão, recepção e validação dos documentos eletrônicos com os tratamentos de IBS e CBS exigidos para 2027.\n4. **Transição tributária:** implementar corretamente a extinção do PIS/COFINS, a entrada em vigor da CBS e os tratamentos aplicáveis ao IBS, conforme o cronograma legal.\n5. **Contabilização:** homologar os lançamentos contábeis, contas e processos de reconhecimento dos novos tributos.\n6. **Testes e homologações:** concluir 100% dos testes críticos obrigatórios com aprovação das áreas responsáveis, sem pendências impeditivas para a entrada em produção.\n7. **Continuidade operacional:** iniciar janeiro de 2027 sem impedimentos sistêmicos críticos que comprometam faturamento, recebimento, contabilização ou cumprimento de obrigações fiscais.\n8. **Governança:** manter documentação das parametrizações, evidências de homologação, controles de mudanças e rastreabilidade das implementações.\n9. **Estabilização:** executar o acompanhamento assistido após a entrada em produção, garantindo tratamento tempestivo de incidentes e inconsistências.\n\n**Validação:** acompanhamento da conclusão do roadmap, aprovação formal dos testes pelas áreas envolvidas, evidências de emissão e recepção fiscal, conciliações contábeis, relatórios de incidentes e confirmação de prontidão dos sistemas antes do início de 2027.","annualHours":null,"annualMoney":null,"attention":"A conclusão do projeto de Reforma Tributária exige atenção especial às dependências técnicas, às mudanças regulatórias e ao cumprimento do cronograma das Waves 1, 2 e 3, considerando o prazo final de 31/12/2026.\n\n**Principais pontos de atenção:**\n\n1. **Prazo legal e cronograma:** assegurar a conclusão e homologação das entregas obrigatórias antes do início de 2027, considerando o prazo reduzido para desenvolvimento, testes e correções.\n\n2. **Pendências da Wave 1:** acompanhar a implementação das contranotas de produtor rural, diferimentos e reduções em MM, parametrizações de DFe Governance e funcionalidades dos cockpits fiscais.\n\n3. **Dependências da Wave 2:** garantir a entrega das regras tributárias relacionadas à base de cálculo do ICMS e dos eventos fiscais, incluindo as dependências de documentos referenciados.\n\n4. **Criticidade da Wave 3:** priorizar as adequações contábeis e sistêmicas relacionadas à CBS, IBS, extinção do PIS/COFINS e demais alterações que impactam diretamente as operações a partir de janeiro de 2027.\n\n5. **Dependência de SAP e fornecedores:** acompanhar a disponibilização de soluções, notas técnicas, atualizações e funcionalidades necessárias à implementação das exigências fiscais.\n\n6. **Integração sistêmica:** validar a consistência das informações entre SAP, MasterSAF, Tax One e demais sistemas, prevenindo divergências nos documentos fiscais e registros contábeis.\n\n7. **Mudanças regulatórias:** monitorar novas regulamentações, notas técnicas e orientações das autoridades fiscais que possam alterar requisitos ou exigir adequações adicionais.\n\n8. **Pendências e itens em espera:** reavaliar os itens classificados como On Hold no roadmap, distinguindo requisitos obrigatórios para 2027 de funcionalidades previstas para etapas futuras da Reforma Tributária.\n\n9. **Disponibilidade das equipes:** garantir recursos e prioridade de atuação das áreas de Tax, IT, Contabilidade, Compras, Vendas e Invoicing para atendimento dos prazos.\n\n10. **Testes e entrada em produção:** assegurar homologações integradas, planos de contingência, preparação do cutover e acompanhamento assistido, evitando impactos nas operações da companhia.\n\n**Mitigação:** realizar acompanhamento contínuo do roadmap, priorizar demandas legais críticas, estabelecer responsáveis e prazos para resolução de pendências, manter alinhamento com fornecedores e executar homologações integradas antes da entrada em produção.","nextSteps":"**Wave 1 – Adequação dos processos operacionais e documentos fiscais**\n\n- Implementar o processo de emissão de contranotas nas aquisições de produtores rurais.\n- Validar e implementar as regras de diferimento e redução tributária nos IVAs de MM.\n- Concluir as parametrizações e validações de entradas fiscais via DFe Governance.\n- Implementar e homologar o cockpit de estorno de documentos NFS-e.\n- Validar a emissão automatizada de notas de débito para operações envolvendo multas e juros.\n\n**Wave 2 – Adequação das regras e eventos tributários**\n\n- Parametrizar o tratamento de IBS e CBS na base de cálculo do ICMS, conforme as exigências legais aplicáveis a cada Unidade Federativa.\n- Implementar e homologar os eventos fiscais relacionados à Reforma Tributária, incluindo suas integrações e referências documentais.\n\n**Wave 3 – Preparação fiscal, contábil e operacional para janeiro de 2027**\n\n- Implementar e validar a contabilização do IBS e da CBS, incluindo as contas contábeis e os registros aplicáveis.\n- Adequar os processos sistêmicos à extinção do PIS e da COFINS, incluindo faturamento e retenções abrangidos pelas novas regras.\n- Realizar a transição da CBS do tratamento estatístico para o tratamento tributário efetivo aplicável em 2027.\n- Implementar as regras de redução tributária nas vendas para órgãos governamentais.\n- Homologar notas de crédito relacionadas à redução de preço e quantidade, incluindo os reflexos contábeis.\n- Implementar o tratamento fiscal de recusa parcial de documentos, conforme os requisitos normativos aplicáveis.\n- Preparar e executar a operação assistida de implantação e estabilização.\n- Validar o processamento dos valores relacionados à apuração assistida e às notas de débito aplicáveis.\n- Adequar os cadastros e as regras de identificação de contribuintes e não contribuintes do IBS e da CBS.\n\n**Atividades complementares e dependências críticas**\n\n- Finalizar as pendências de NFS-e, royalties, notas de débito/crédito e suas contabilizações.\n- Concluir o desenvolvimento e a homologação das devoluções de compras com documentos fiscais referenciados em nível de item.\n- Avaliar as regras da NF-e de transferência de saldo de ICMS e o tratamento dos totais fiscais.\n- Acompanhar a adequação ao CNPJ alfanumérico e às integrações entre sistemas, conforme aplicabilidade e cronograma legal.\n- Reavaliar os itens em espera que possam representar dependência obrigatória para janeiro de 2027.\n\n**Marco final:** concluir as adequações, testes integrados, homologações, documentação e preparação de entrada em produção até 31/12/2026, assegurando a continuidade e conformidade das operações a partir de 01/01/2027.","milestones":[],"risks":[],"updates":[],"createdAt":"2026-10-16T14:13:36.653Z","updatedAt":"2026-10-16T14:16:08.224Z"}]}</script>
<script>
'use strict';
const TEMPLATE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const sum=(a,f)=>a.reduce((s,x)=>s+n(f(x)),0);
const fmt=(v,d=0)=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:d});
const money=v=>n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2});
const shortMoney=v=>Math.abs(v)>=1000000?'R$ '+fmt(v/1000000,1)+' mi':Math.abs(v)>=10000?'R$ '+fmt(v/1000,1)+' mil':money(v);
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);

const APP_TIMEZONE='America/Sao_Paulo';
const MIN_DATE_YEAR=1900,MAX_DATE_YEAR=2100;
function calendarDate(iso){if(typeof iso!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return null;const [y,m,d]=iso.split('-').map(Number);if(y<MIN_DATE_YEAR||y>MAX_DATE_YEAR||m<1||m>12||d<1||d>31)return null;const result=new Date(0);result.setUTCHours(12,0,0,0);result.setUTCFullYear(y,m-1,d);return result.getUTCFullYear()===y&&result.getUTCMonth()===m-1&&result.getUTCDate()===d?result:null}
const isValidISODate=s=>!!calendarDate(s);
const today=()=>{const parts=new Intl.DateTimeFormat('en-US',{timeZone:APP_TIMEZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));return obj.year+'-'+obj.month+'-'+obj.day};
const day=s=>calendarDate(s);
const date=s=>isValidISODate(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):s?'Data inválida':'Não definido';
const dateValue=s=>isValidISODate(s)?date(s):'';
function inputDateToISO(text){const value=String(text??'').trim();if(!value)return '';let iso;if(/^\d{4}-\d{2}-\d{2}$/.test(value))iso=value;else{const match=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value)||/^(\d{2})(\d{2})(\d{4})$/.exec(value);if(!match)return null;iso=match[3]+'-'+match[2]+'-'+match[1]}return isValidISODate(iso)?iso:null}
const addDays=(s,num)=>{const d=calendarDate(s);if(!d)throw Error('Data de calendário inválida.');d.setUTCDate(d.getUTCDate()+num);return d.toISOString().slice(0,10)};
const monday=s=>{const d=calendarDate(s);if(!d)throw Error('Selecione uma data completa e válida.');return addDays(s,-((d.getUTCDay()+6)%7))};
const diffDays=(a,b)=>{const first=calendarDate(a),second=calendarDate(b);return first&&second?Math.round((first-second)/86400000):null};
function dateControl(id,name,iso,required=false){return '<div class="date-control"><input id="'+esc(id)+'" '+(name?'name="'+esc(name)+'" ':'')+'type="text" data-date-input="true" data-stored-iso="'+esc(iso||'')+'" '+(required?'data-date-required="true" ':'')+'value="'+esc(dateValue(iso))+'" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" autocomplete="off" aria-describedby="'+esc(id)+'-format"><button type="button" class="date-calendar-button" data-action="open-date-picker" data-target="'+esc(id)+'" aria-label="Selecionar data no calendário">'+icon('calendar')+'</button><input type="date" id="'+esc(id)+'-picker" class="native-date-picker" tabindex="-1" aria-label="Calendário de apoio" min="1900-01-01" max="2100-12-31" value="'+esc(isValidISODate(iso)?iso:'')+'" data-date-picker="true" data-target="'+esc(id)+'"></div><small id="'+esc(id)+'-format" class="date-format-hint">DD/MM/AAAA · ano entre 1900 e 2100</small>'}
function validateDateInput(el){const iso=inputDateToISO(el.value);el.setCustomValidity('');if(iso===null)el.setCustomValidity('Informe uma data válida em DD/MM/AAAA, com ano entre 1900 e 2100.');if(iso===''&&(el.dataset.dateRequired==='true'||el.name==='week'||(el.name==='date'&&el.closest('#entryForm'))))el.setCustomValidity('Informe uma data completa em DD/MM/AAAA.');if(iso&&iso!==null){const inProject=!!el.closest('#projectForm'),inEntry=!!el.closest('#entryForm');const p=projectById(inProject?editingProject:inEntry?entryContext?.pid:null);if(p&&inEntry&&(el.name==='week'||el.name==='date')&&p.updates.some(u=>u.id!==entryContext.id&&u.week===monday(iso)))el.setCustomValidity('Já existe uma atualização para esta semana. Edite o registro existente.');if(p&&inProject&&el.name==='end'&&p.start&&iso<p.start)el.setCustomValidity('O prazo final não pode ser anterior ao início.');if(p&&inProject&&el.name==='start'&&p.end&&iso>p.end)el.setCustomValidity('O início não pode ser posterior ao prazo final.')}return iso}

function spark(projects){const grouped=new Map();for(const p of projects)for(const u of p.updates){const recordedDate=updateDate(u);if(!isValidISODate(recordedDate))continue;if(!grouped.has(recordedDate))grouped.set(recordedDate,[]);grouped.get(recordedDate).push({p,u})}const dates=[...grouped.keys()].sort().slice(-8);const values=dates.map(recordedDate=>({recordedDate,entries:grouped.get(recordedDate),hours:sum(grouped.get(recordedDate),x=>x.u.hours)}));if(!values.length)return '<div class="empty-chart">Registre uma atualização para visualizar horas pela data efetivamente informada.</div>';const max=Math.max(...values.map(x=>x.hours),1),column=420/values.length;return '<div class="chart-caption">Horas por data da atualização · últimas '+values.length+' data(s) com registros · clique para abrir os detalhes</div><svg viewBox="0 0 420 118" class="chart" role="group" aria-label="Horas por data efetiva da atualização; cada barra abre os registros correspondentes">'+[25,55,85].map(y=>'<line x1="5" y1="'+y+'" x2="415" y2="'+y+'" stroke="#edf1f3"/>').join('')+values.map((x,i)=>{const center=(i+.5)*column,width=Math.min(38,column*.55),h=x.hours/max*66;const one=x.entries.length===1?x.entries[0]:null;const pid=projects.length===1?projects[0].id:one?one.p.id:'';return '<g class="chart-week" tabindex="0" role="link" data-action="view-week" data-id="'+pid+'" data-week="'+monday(x.recordedDate)+'" data-date="'+x.recordedDate+'" data-entry="'+(one?one.u.id:'')+'" aria-label="Atualização de '+date(x.recordedDate)+': '+fmt(x.hours,1)+' horas. Abrir registros."><title>Atualização de '+date(x.recordedDate)+' · '+fmt(x.hours,1)+' h</title><rect x="'+(center-column*.44)+'" y="5" width="'+column*.88+'" height="110" fill="transparent"/><rect x="'+(center-width/2)+'" y="'+(88-Math.max(2,h))+'" width="'+width+'" height="'+Math.max(2,h)+'" rx="3" fill="'+(i===values.length-1?'#B4BD00':'#003DA6')+'"/><text x="'+center+'" y="'+(81-h)+'" text-anchor="middle">'+fmt(x.hours,1)+'h</text><text x="'+center+'" y="109" text-anchor="middle" class="chart-date-label">'+x.recordedDate.slice(8)+'/'+x.recordedDate.slice(5,7)+'</text></g>'}).join('')+'</svg>'}
function executive(){const ps=scoped(),m=metrics(ps),one=ps.length===1?ps[0]:null;const donePct=m.milestones.length?m.done/m.milestones.length*100:null;const financial=ps.some(hasFinancialData);const consumed=m.budget>0?m.cost/m.budget*100:null;const next=ps.flatMap(p=>p.milestones.filter(x=>!x.done&&x.due).map(x=>({...x,project:p.name}))).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3);const wk=sum(ps,p=>sum(p.updates.filter(u=>u.week===week),u=>u.hours));
return '<section class="hero"><div><div class="eyebrow">Estratégia • Tecnologia • Transformação</div><h1>Inteligência em cada avanço.</h1><p>Projetos de Tax Intelligence e seu desenvolvimento: prioridades claras, evolução visível e resultados que geram valor para a GDM.</p></div><div class="hero-side">'+tag('TAX INTELLIGENCE','dark')+'<strong>'+String(state.projects.length).padStart(2,'0')+'</strong><span>projetos no portfólio</span></div></section><div class="toolbar"><div><h2>Visão executiva</h2><p>'+esc(one?one.name:'Indicadores consolidados do portfólio')+' · posição em '+date(today())+'</p></div><div class="actions">'+scopeFilter()+'<button class="btn" data-action="print">'+icon('download')+'Imprimir / PDF</button>'+(one?'<button class="btn primary" data-action="edit" data-id="'+one.id+'">Gerenciar projeto</button>':'')+'</div></div><div class="stats executive-stats '+(financial?'':'without-finance')+'">'+stat('Projetos no recorte',fmt(ps.length),m.closed+' concluído(s) · '+m.late+' em atraso','folder')+stat('Horas de desenvolvimento',fmt(m.hours,1)+'<span style="font-size:16px"> h</span>',m.planned?fmt(m.planned,1)+' h planejadas':'Planejamento não informado','clock')+(financial?stat('Investimento acumulado',shortMoney(m.cost),m.budget?'Orçamento: '+money(m.budget):'Orçamento não informado','coin'):'')+stat('Ganho de horas esperado',ps.some(hasHoursBenefit)?fmt(m.annualHours,1)+'<span style="font-size:16px"> h/ano</span>':'—',ps.some(hasHoursBenefit)?fmt(m.annualHours/12,1)+' h/mês · equivalente anual':'Cadastre o benefício em cada projeto','trend')+'</div><div class="dashboard-grid '+(financial?'':'no-finance')+'">'+
effortDashboard(ps,m)+
'<section class="panel"><div class="panel-head"><div><div class="eyebrow">Execução</div><h3>Prazo & entregas</h3></div><span class="number">02</span></div><div class="big-number">'+(donePct===null?'—':fmt(donePct)+'%')+' <small>dos marcos concluídos</small></div><div class="three-cols"><div class="mini-kpi"><b>'+m.done+'/'+m.milestones.length+'</b><span>marcos concluídos</span></div><div class="mini-kpi"><b>'+m.lateMilestones+'</b><span>marcos atrasados</span></div><div class="mini-kpi"><b>'+m.late+'</b><span>projetos em atraso</span></div></div>'+progress(donePct,'lime')+''+milestonesDashboard(ps)+'<div class="panel-foot">Marco atrasado: não concluído e vencido. Projeto atrasado: prazo final vencido, exceto concluídos e cancelados.</div></section>'+
(financial?'<section class="panel"><div class="panel-head"><div><div class="eyebrow">Investimento</div><h3>Custos & orçamento</h3></div><span class="number">03</span></div><div class="big-number">'+shortMoney(m.cost)+' <small>realizados</small></div><div style="margin:22px 0"><div class="progress-label"><span>Consumo do orçamento</span><b>'+(consumed===null?'Não definido':fmt(consumed,1)+'%')+'</b></div>'+progress(consumed,consumed>100?'copper':'')+'</div><div class="kpi-list">'+kv('Orçamento aprovado',m.budget?money(m.budget):'Não informado')+kv('Saldo orçamentário',m.budget?money(m.budget-m.cost):'—')+kv('Custo das horas',ps.some(hourCostEnabled)?money(sum(ps,p=>laborCost(p))):'Desativado')+kv('Despesas adicionais',money(sum(ps,expenses)))+'</div><div class="panel-foot">Custo = despesas + custeio das horas, somente nos projetos com a opção ativada. Ao desativar, horas e benefícios permanecem registrados. Valores em BRL.</div></section>':'')+
'<section class="panel impact-panel"><div class="panel-head"><div><div class="eyebrow">Impacto & governança</div><h3>Benefícios & riscos</h3></div><span class="number">04</span></div><div class="impact-body"><div class="benefit-band savings"><div><div class="small">Ganho de horas esperado para a empresa</div><div class="big-number">'+(ps.some(hasHoursBenefit)?fmt(m.annualHours,1)+' <small>h/ano</small>':'—')+'</div><div class="small">'+(ps.some(hasHoursBenefit)?fmt(m.annualHours/12,1)+' h/mês · média anual equivalente':'Cadastre o benefício no projeto.')+'</div></div>'+icon('clock')+'</div><div><div class="kpi-list">'+kv('Benefício financeiro / ano',ps.some(p=>p.annualMoney!==null&&p.annualMoney!=='')?money(m.annualMoney):'Não informado')+kv('Riscos em aberto',fmt(m.openRisks.length))+kv('Riscos altos / críticos',fmt(m.critical))+kv('Atualizações nesta semana',fmt(ps.filter(p=>p.updates.some(u=>u.week===monday(today()))).length)+' / '+ps.length)+'</div><div class="risk-list" style="margin-top:17px">'+(ps.length?['No ritmo','Atenção','Bloqueado'].map(h=>healthTag(h+' · '+ps.filter(p=>health(p)===h).length)).join(''):'<span class="small muted">Aguardando cadastro de projetos.</span>')+'</div></div></div><div class="panel-foot">Benefícios são estimativas anuais declaradas; não representam ganhos realizados. O ganho de horas independe da ativação de custo/hora.</div></section></div>'+(ps.length?savingsOverview(ps):'')+(state.projects.length?'':empty())+(one?'<section class="panel" style="margin-top:20px"><div class="subhead"><h3>Direcionamento do projeto</h3>'+statusTag(one.status)+'</div><div class="week-body"><div class="text-block"><h4>Benefícios e resultados esperados</h4><p>'+esc(one.benefits||'Benefícios não informados.')+'\n'+esc(one.expectedResults)+'</p></div><div class="text-block"><h4>Próximos passos</h4><p>'+esc(latestNext(one))+'</p></div></div></section>':'');}

function projectsView(){const ps=state.projects.filter(p=>(statusFilter==='all'||p.status===statusFilter)&&[p.name,p.area,p.owner,p.description].join(' ').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR'))).sort((a,b)=>priorities.indexOf(b.priority)-priorities.indexOf(a.priority));return '<div class="view-head"><div><div class="eyebrow muted">Gestão do portfólio</div><h1 style="margin-top:8px">Projetos</h1><p>Planeje, desenvolva e acompanhe cada iniciativa de Tax Intelligence.</p></div><button class="btn primary" data-action="new">'+icon('plus')+'Novo projeto</button></div><div class="toolbar"><div class="actions"><input type="search" id="search" aria-label="Buscar projetos" placeholder="Buscar projeto, área ou responsável…" value="'+esc(search)+'"><select id="statusFilter" aria-label="Filtrar status"><option value="all">Todos os status</option>'+statusList.map(s=>'<option '+(s===statusFilter?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="actions"><span class="small muted">'+ps.length+' projeto(s)</span><div class="segmented"><button data-action="cards" class="'+(!listMode?'active':'')+'">'+icon('dashboard')+'Cards</button><button data-action="list" class="'+(listMode?'active':'')+'">'+icon('list')+'Lista</button></div></div></div>'+(ps.length?(listMode?'<div class="table-wrap"><table><thead><tr><th>Projeto / responsável</th><th>Status</th><th>Prioridade</th><th>Avanço por horas</th><th>Horas</th><th>Prazo final</th><th>Custo</th><th>Ações</th></tr></thead><tbody>'+ps.map(p=>{const m=metrics([p]);return '<tr><td><strong>'+esc(p.name)+'</strong><br><small class="muted">'+esc(p.owner||'Sem responsável')+'</small></td><td>'+statusTag(p.status)+'</td><td>'+tag(p.priority,p.priority==='Crítica'?'red':'')+'</td><td>'+(m.progress===null?'—':fmt(m.progress,1)+'%')+progress(m.progress)+'</td><td>'+fmt(m.hours,1)+' / '+(m.planned?fmt(m.planned,1):'—')+'</td><td>'+date(p.end)+'</td><td>'+money(m.cost)+'</td><td><button class="btn small" data-action="edit" data-id="'+p.id+'">Gerenciar</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="project-grid">'+ps.map(p=>{const m=metrics([p]);return '<article class="project-card"><div class="actions" style="justify-content:space-between">'+statusTag(p.status)+tag(p.priority,p.priority==='Crítica'?'red':p.priority==='Alta'?'copper':'')+'</div><div><div class="eyebrow muted" style="margin-bottom:8px">'+esc(p.area||'Tax Intelligence')+'</div><h3>'+esc(p.name)+'</h3><p style="margin-top:9px">'+esc(p.description||'Adicione o objetivo e o escopo desta iniciativa.')+'</p></div><div class="card-meta"><span>'+esc(p.owner||'Sem responsável')+'</span><span>'+date(p.end)+'</span></div><div><div class="progress-label"><span>Avanço por horas</span><b>'+(m.progress===null?'—':fmt(m.progress,1)+'%')+'</b></div>'+progress(m.progress)+'<div class="card-meta" style="margin-top:9px"><span>'+fmt(m.hours,1)+' / '+(m.planned?fmt(m.planned,1):'—')+' h</span><span>'+money(m.cost)+'</span></div></div><div class="savings-card">'+icon('clock')+'<span>'+esc(hoursBenefitText(p))+'<small>Economia esperada para a empresa</small></span></div><div class="card-foot"><button class="btn small" data-action="report" data-id="'+p.id+'">'+icon('dashboard')+'KPIs</button><button class="btn small primary" data-action="edit" data-id="'+p.id+'">Gerenciar '+icon('arrow')+'</button></div></article>'}).join('')+'</div>'):state.projects.length?'<div class="empty"><h3>Nenhum projeto encontrado.</h3><p>Ajuste a busca ou os filtros.</p></div>':empty());}
function weeklyView(){const ps=scoped(),financial=ps.some(hasFinancialData),entries=updateEntries(ps).filter(({u})=>weeklyMode==='all'||u.week===week);const initial=sum(ps,p=>p.baseHours);return '<div class="view-head"><div><div class="eyebrow muted">Ritmo de execução</div><h1 style="margin-top:8px">Atualização semanal</h1><p>Novidades, avanços e próximos passos de cada registro de desenvolvimento.</p></div><div class="actions"><button class="btn" data-action="back-executive">'+icon('dashboard')+'Voltar à visão executiva</button><button class="btn primary" data-action="add-week">'+icon('plus')+'Registrar semana</button></div></div><div class="toolbar"><div class="actions"><div class="segmented"><button class="'+(weeklyMode==='week'?'active':'')+'" data-action="weekly-week">Semana selecionada</button><button class="'+(weeklyMode==='all'?'active':'')+'" data-action="weekly-all">Todo o histórico</button></div>'+(weeklyMode==='week'?'<button class="btn small" data-action="prev-week" aria-label="Semana anterior">←</button><div class="filter weekly-date-filter"><label for="weekFilter">Data de referência</label><div>'+dateControl('weekFilter','',weekFilterDate,true)+'</div><button class="btn small" data-action="apply-week-filter">Aplicar</button></div><button class="btn small" data-action="next-week" aria-label="Próxima semana">→</button><span class="small muted">'+date(week)+' a '+date(addDays(week,6))+'</span>':'')+'</div>'+scopeFilter()+'</div>'+(weeklyMode==='all'&&initial>0?'<div class="notice"><b>'+fmt(initial,1)+' h de saldo inicial</b> estão incluídas nas horas totais do projeto e não possuem registro semanal vinculado. A lista abaixo detalha os apontamentos semanais.</div>':'')+'<div class="stats weekly-stats '+(financial?'':'without-finance')+'">'+stat('Projetos com atualização',new Set(entries.map(x=>x.p.id)).size+' / '+ps.length,weeklyMode==='all'?'Em todo o histórico':'Na semana selecionada','folder')+stat(weeklyMode==='all'?'Horas registradas nas semanas':'Horas da semana',fmt(sum(entries,x=>x.u.hours),1)+' h',entries.length+' registro(s) com detalhamento','clock')+(financial?stat(weeklyMode==='all'?'Despesas registradas':'Despesas da semana',shortMoney(sum(entries,x=>x.u.expenses)),'Exclui custo calculado das horas','coin')+stat(weeklyMode==='all'?'Custo dos registros':'Custo total da semana',shortMoney(sum(entries,x=>n(x.u.expenses)+laborCost(x.p,x.u.hours))),'Despesas + custeio das horas, se ativado','trend'):'')+'</div>'+entries.map(({p,u})=>'<article id="update-'+u.id+'" tabindex="-1" class="week-card '+(highlightedUpdateId===u.id?'selected-update':'')+'"><div class="week-head"><div><div class="eyebrow muted">Atualização de '+date(updateDate(u))+' · Semana de '+date(u.week)+' a '+date(addDays(u.week,6))+' · '+esc(p.area)+'</div><h3 style="font-size:20px;margin:5px 0 8px">'+esc(p.name)+'</h3><div class="actions">'+healthTag(u.health)+'<span class="small muted">'+fmt(u.hours,1)+' h'+(hasFinancialData(p)?' · '+money(u.expenses)+' em despesas':'')+' · '+esc(u.author||'Responsável não informado')+'</span></div></div><button class="btn small" data-action="edit-week" data-id="'+p.id+'" data-entry="'+u.id+'">'+icon('edit')+'Editar atualização</button></div><div class="week-body">'+textBlock('Resumo executivo',u.summary)+textBlock('Novidades e avanços',u.achievements)+textBlock('Pontos de atenção',u.attention)+textBlock('Próximos passos',u.nextSteps)+'</div></article>').join('')+(entries.length?'':'<div class="empty">'+icon('calendar')+'<h3>Nenhuma atualização neste recorte.</h3><p>Registre a evolução ou consulte todo o histórico do projeto.</p><div class="actions"><button class="btn" data-action="weekly-all">Ver todo o histórico</button><button class="btn primary" data-action="add-week">Registrar atualização</button></div></div>');}
function textBlock(title,text){return '<div class="text-block"><h4>'+esc(title)+'</h4><p>'+esc(text||'Não informado.')+'</p></div>'}
function helpView(){return '<div class="view-head"><div><div class="eyebrow muted">Seu centro de controle</div><h1 style="margin-top:8px">Dados e orientações</h1><p>Um arquivo completo. Um processo claro para manter seus projetos atualizados.</p></div></div><div class="help-grid"><section class="panel"><h3>'+icon('save')+' Salvar no próprio HTML</h3><ol><li>Baixe e abra este HTML no Microsoft Edge ou Google Chrome.</li><li>Clique em <b>Ativar gravação no HTML</b> e escolha o arquivo de destino. Você pode selecionar o próprio HTML aberto ou criar uma nova cópia.</li><li>Autorize a gravação quando o navegador solicitar. Cada alteração válida é gravada automaticamente após uma breve pausa.</li><li>Aguarde <b>HTML salvo</b> antes de fechar. Ao reabrir, ative a gravação novamente.</li></ol><div class="notice">O navegador não permite que um HTML sobrescreva arquivos sem sua autorização. Se a função não estiver disponível, use <b>Baixar HTML</b> para obter uma versão com todos os dados incorporados.</div><p>A cópia automática no navegador ajuda a recuperar alterações, mas não atualiza o arquivo físico. Use uma única aba de edição. Cópias distribuídas do HTML não são sincronizadas.</p><div class="actions" style="margin-top:16px"><button class="btn primary" data-action="connect">Ativar gravação</button><button class="btn" data-action="download">Baixar HTML atualizado</button></div></section><section class="panel"><h3>'+icon('shield')+' Backup e portabilidade</h3><p><b>Restaurar um backup:</b> clique em <b>Importar backup JSON</b>, selecione o arquivo exportado anteriormente e confirme a restauração. Projetos, horas, benefícios e histórico semanal serão recuperados. A importação substitui toda a base atual após sua confirmação. Exporte a base atual antes de substituí-la, se desejar preservá-la. Backups da versão anterior são compatíveis. O HTML também carrega seus próprios dados e a logo; funciona offline, sem bibliotecas externas.</p><div class="actions" style="margin:20px 0"><button class="btn" data-action="json-export">Exportar backup JSON</button><button class="btn primary" data-action="json-import">Importar backup JSON</button><button class="btn" data-action="csv">Exportar resumo CSV</button></div><p><b>Uso local e individual:</b> não há servidor, autenticação nem edição colaborativa. Quem recebe uma cópia do HTML pode visualizar os dados incorporados. Políticas corporativas podem limitar a gravação pelo navegador.</p><div class="notice">Para apresentar à liderança, filtre o projeto em <b>Visão executiva</b> e utilize <b>Imprimir / PDF</b>.</div><button class="btn" data-action="demo">'+(demo?'Sair da demonstração':'Explorar demonstração isolada')+'</button></section><section class="panel wide"><h3>Como os painéis executivos são calculados</h3><div class="notice"><b>Configuração das datas:</b> preenchimento e exibição em DD/MM/AAAA. Os cálculos de dias e semanas usam datas de calendário; a data de hoje e os horários exibidos seguem America/Sao_Paulo. Datas incompletas e anos fora de 1900–2100 não são salvos. A data escolhida é mantida exatamente como informada, inclusive ao reabrir. A segunda-feira é apenas uma chave interna para agrupar os indicadores semanais; ela não substitui a data da atualização nem a data de referência do filtro.</div><div class="table-wrap"><table><thead><tr><th>Painel</th><th>Indicadores e regras</th><th>Interpretação</th></tr></thead><tbody><tr><td><b>01 · Esforço & avanço</b></td><td>Horas realizadas = saldo inicial + horas semanais.<br>Avanço = mínimo(100%, realizadas ÷ previstas × 100).<br>Consumo = realizadas ÷ previstas × 100.</td><td>O percentual solicitado mede consumo de esforço.<br>O gráfico agrupa e rotula as horas pela data efetiva da atualização. Clique nas barras ou nas horas para abrir os registros. O intervalo semanal continua disponível na tela de atualizações. O saldo inicial é exibido separadamente. A conclusão real é acompanhada por marcos e status.</td></tr><tr><td><b>02 · Prazo & entregas</b></td><td>Marcos concluídos ÷ total de marcos.<br>Atraso = data vencida e entrega pendente.</td><td>Marcos têm pesos iguais. O painel mostra pendentes e concluídos, com escopo, resultado, evidência e semana vinculada. Status concluído é manual.<br>O prazo não determina sozinho o avanço.</td></tr><tr><td><b>03 · Custos & orçamento</b></td><td>Custo = despesas iniciais + despesas semanais + horas realizadas × custo/hora, somente se o custeio estiver ativado.<br>Saldo = orçamento − custo. Consumo = custo ÷ orçamento.</td><td>O painel financeiro e seu indicador ficam ocultos se não houver orçamento, despesas ou custo/hora ativo com valor positivo no recorte. Custeio de horas é opcional por projeto; novos projetos começam desativados.<br>Alterar a taxa recalcula todas as horas históricas.<br>Desativar preserva a taxa e os registros de horas.<br>Valores negativos de saldo mostram estouro.</td></tr><tr><td><b>04 · Benefícios & riscos</b></td><td>Ganho anual de horas cadastrado por projeto; equivalente mensal = anual ÷ 12.<br>Benefício financeiro anual esperado.<br>Riscos abertos, altos e críticos; cobertura de atualizações.</td><td>Ganhos de horas permanecem ativos com ou sem custeio.<br>Benefícios não são somados ao investimento.<br>Não há ROI ou valor agregado sem medição real.<br>Saúde é um sinal de gestão, não uma previsão.</td></tr></tbody></table></div><div class="notice"><b>Dados não informados:</b> campos sem base de cálculo exibem “—” ou “Não informado”. Consolidados somam apenas valores informados; um orçamento parcial pode distorcer a leitura do portfólio. Cadastre horas e orçamento de todos os projetos para comparações consistentes.</div><p><b>Saúde do projeto:</b> Bloqueado se o último status semanal for bloqueado ou existir risco crítico aberto. Atenção se houver pausa, atraso, excesso de horas, excesso de orçamento, risco alto ou status semanal de atenção. Nos demais casos: No ritmo. Concluídos e cancelados conservam seus próprios estados.</p></section><section class="panel wide"><h3>Referências de mercado e critérios de escolha</h3><p>Os painéis combinam as dimensões de tempo, orçamento, entregas e riscos presentes em soluções de gestão. A seleção foi adaptada ao acompanhamento de desenvolvimento de Tax Intelligence e evita indicadores que exigiriam dados não coletados.</p><ul><li><a href="https://asana.com/features/resource-management/timesheets-budgets" target="_blank" rel="noopener noreferrer">Asana — Timesheets and budgets</a>: comparação de horas, custos estimados e realizados.</li><li><a href="https://www.atlassian.com/software/jira/features/project-dashboard" target="_blank" rel="noopener noreferrer">Atlassian Jira — Project dashboard</a>: status, orçamento e aderência ao cronograma.</li><li><a href="https://www.atlassian.com/work-management/project-management/project-progress" target="_blank" rel="noopener noreferrer">Atlassian — Project progress</a>: marcos, atualizações e tratamento de riscos.</li><li><a href="https://developer.chrome.com/docs/capabilities/web-apis/file-system-access" target="_blank" rel="noopener noreferrer">Chrome Developers — File System Access</a>: autorização e gravação de arquivos pelo navegador.</li></ul><p>Referências consultadas em 15/10/2026. Os links são opcionais e exigem internet; a aplicação funciona sem eles.</p></section></div>'}
function render(){if(selected!=='all'&&!projectById(selected))selected='all';$('#view').innerHTML=({executive,projects:projectsView,weekly:weeklyView,help:helpView}[currentView])();$('#crumb').textContent={executive:'Visão executiva',projects:'Projetos',weekly:'Atualização semanal',help:'Dados e orientações'}[currentView];$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===currentView));$('#alerts').innerHTML=(recoveryIssue?'<div class="banner warn"><div><strong>A cópia local contém uma data ou outro dado inválido.</strong>'+esc(recoveryIssue.message)+' Os dados incorporados neste HTML foram mantidos. Exporte a cópia local antes de substituí-la.</div><div class="actions"><button class="btn small" data-action="export-invalid-cache">Preservar backup local</button><button class="btn small primary" data-action="use-embedded-data">Usar dados deste arquivo</button></div></div>':'')+(demo?'<div class="banner"><div><strong>Demonstração • dados fictícios</strong>Explore o funcionamento. As alterações neste modo não afetam sua base real.</div><button class="btn small" data-action="demo">Voltar à minha base</button></div>':'')+(cacheCandidate?'<div class="banner warn"><div><strong>Há uma cópia local mais recente.</strong>Recupere as alterações deste navegador ou mantenha os dados incorporados no HTML.</div><div class="actions"><button class="btn small primary" data-action="recover">Recuperar alterações</button><button class="btn small" data-action="discard-recovery">Manter arquivo</button></div></div>':'');$('#footerDate').textContent=state.updatedAt?'Última alteração: '+new Date(state.updatedAt).toLocaleString('pt-BR',{timeZone:APP_TIMEZONE}):'Pronto para seu primeiro projeto';updateSaveState();$$('[data-icon]').forEach(x=>x.innerHTML=icon(x.dataset.icon));}

if(type==='risk')body=field('Descrição do risco *','title',e.title,'text','',true)+field('Severidade','severity',e.severity,'text','',false,['Baixo','Médio','Alto','Crítico'])+field('Situação','status',e.status,'text','',false,['Aberto','Em tratamento','Resolvido'])+field('Responsável','owner',e.owner)+field('Prazo de mitigação','due',e.due,'date')+field('Plano de mitigação / ação','mitigation',e.mitigation,'textarea','',true);

function handleField(event){const el=event.target;if(!el.name)return;const inProject=!!el.closest('#projectForm'),inEntry=!!el.closest('#entryForm');if(!inProject&&!inEntry)return;const p=projectById(inProject?editingProject:entryContext.pid);if(!p)return;const target=inProject?p:p[entryContext.collection].find(x=>x.id===entryContext.id);const key=el.name;const isDateField=el.dataset.dateInput==='true';let value=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?null:Number(el.value)):el.value;el.setCustomValidity('');if(isDateField)value=validateDateInput(el);const statusEl=inProject?$('#fieldStatus'):$('#entryStatus');
if((key==='name'||key==='title')&&!String(value).trim())el.setCustomValidity('Preencha este campo antes de concluir.');
if(isDateField&&!el.checkValidity()){statusEl.textContent='Data incompleta ou inválida • não salva';return}
const isWeeklyDate=inEntry&&entryContext.type==='week'&&(key==='date'||key==='week');if(isWeeklyDate){if(!value)el.setCustomValidity('Selecione uma data.');else if(p.updates.some(u=>u.id!==target.id&&u.week===monday(value)))el.setCustomValidity('Já existe uma atualização para esta semana. Edite o registro existente.');}
if(inProject&&key==='end'&&value&&p.start&&value<p.start)el.setCustomValidity('O prazo final não pode ser anterior ao início.');
if(inProject&&key==='start'&&value&&p.end&&value>p.end)el.setCustomValidity('O início não pode ser posterior ao prazo final.');
if(!el.checkValidity()){statusEl.textContent='Campo inválido • ainda não salvo';return}
if(isDateField&&target[key]===value&&(!isWeeklyDate||target.week===monday(value)))return;target[key]=value;if(isWeeklyDate){target.date=value;target.week=monday(value)}if(isDateField)el.dataset.storedIso=value||'';if(inEntry&&entryContext.type==='milestone'&&key==='done')target.completedDate=value?(target.completedDate||today()):'';if(inEntry&&entryContext.type==='milestone'&&key==='linkedUpdateId'&&value&&!p.updates.some(u=>u.id===value)){target[key]='';return}target.updatedAt=new Date().toISOString();p.updatedAt=new Date().toISOString();if(inProject&&key==='status'&&value==='Concluído'&&!p.completedDate)p.completedDate=today();touch();statusEl.textContent=demo?'Demonstração alterada':fileHandle?'Gravação automática em andamento':cacheOk?'Alteração salva no navegador':'Sem cópia local: baixe o HTML';if(inEntry&&entryContext.type==='milestone'&&key==='done'&&$('#field-completedDate'))$('#field-completedDate').value=dateValue(target.completedDate);if(key==='name')$('#editorTitle').textContent=value;if(inProject&&key==='hourCostEnabled'){$('#field-hourlyRate').disabled=!value;$('#field-hourlyRate').value=p.hourlyRate;$('#field-hourlyRate').setCustomValidity('');$('#hourlyRateSection').classList.toggle('hidden',!value);$('#costToggleHint').textContent=value?'Ativado: o investimento inclui mão de obra e despesas.':'Desativado: o investimento considera somente despesas. Horas de desenvolvimento e ganhos de horas continuam disponíveis.'}if(inProject&&key==='annualHours'&&$('#savingsSummary'))$('#savingsSummary').innerHTML=savingsSummary(p);if(inProject&&projectTab==='resources'&&$('#resourceSummary')){const m=metrics([p]);$('#resourceSummary').innerHTML=stat('Horas acumuladas',fmt(m.hours,1)+' h','Saldo inicial + registros semanais','clock')+stat('Avanço por horas',m.progress===null?'—':fmt(m.progress,1)+'%','Não mede entregas concluídas','trend')+stat('Custo acumulado',shortMoney(m.cost),'Horas + despesas','coin');}

function validateState(raw){
if(!raw||raw.schemaVersion!==1||typeof raw.documentId!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(raw.documentId)||!Number.isInteger(raw.revision)||raw.revision<0||!Array.isArray(raw.projects)||raw.projects.length>2000)throw Error('Estrutura de backup incompatível.');
const strings=(o,keys,max=20000)=>keys.forEach(k=>{if(typeof o[k]!=='string'||o[k].length>max)throw Error('Campo de texto inválido: '+k)});
const nums=(o,keys)=>keys.forEach(k=>{if(o[k]!==null&&(typeof o[k]!=='number'||!Number.isFinite(o[k])||o[k]<0||o[k]>1e12))throw Error('Valor numérico inválido: '+k)});
const dates=(o,keys)=>keys.forEach(k=>{if(o[k]!==''&&!isValidISODate(o[k]))throw Error('Data inválida no campo '+k+'. Use ano entre 1900 e 2100.')} );
const unique=new Set();const id=o=>{if(typeof o.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(o.id)||unique.has(o.id))throw Error('Identificador inválido ou repetido.');unique.add(o.id)};
for(const p of raw.projects){if(p.hourCostEnabled!==undefined&&typeof p.hourCostEnabled!=='boolean')throw Error('Opção de custeio inválida.');if(p.savingsMethod!==undefined&&(typeof p.savingsMethod!=='string'||p.savingsMethod.length>20000))throw Error('Memória de cálculo inválida.');id(p);strings(p,['name','area','owner','sponsor','description','benefits','expectedResults','attention','nextSteps','status','priority','start','end','completedDate']);if(!p.name.trim()||!statusList.includes(p.status)||!priorities.includes(p.priority))throw Error('Projeto ou status inválido.');nums(p,['plannedHours','baseHours','baseCost','hourlyRate','budget','annualHours','annualMoney']);dates(p,['start','end','completedDate']);if(p.start&&p.end&&p.start>p.end)throw Error('Datas do projeto inconsistentes.');for(const a of ['updates','risks','milestones'])if(!Array.isArray(p[a])||p[a].length>10000)throw Error('Registros inválidos.');const weeks=new Set();for(const u of p.updates){id(u);strings(u,['week','summary','achievements','attention','nextSteps','health','author']);nums(u,['hours','expenses']);dates(u,['week']);if(u.date!==undefined){dates(u,['date']);if(!u.date||monday(u.date)!==u.week)throw Error('A data da atualização não corresponde à semana de agrupamento.')}if(!u.week||monday(u.week)!==u.week||weeks.has(u.week)||!healthList.includes(u.health))throw Error('Semana duplicada ou inválida.');weeks.add(u.week)}for(const r of p.risks){id(r);strings(r,['title','severity','status','mitigation','owner','due']);dates(r,['due']);if(!['Baixo','Médio','Alto','Crítico'].includes(r.severity)||!['Aberto','Em tratamento','Resolvido'].includes(r.status)||!r.title.trim())throw Error('Risco inválido.')}for(const m of p.milestones){id(m);strings(m,['title','due','owner']);dates(m,['due']);for(const k of ['description','result','evidence','completedDate','linkedUpdateId'])if(m[k]!==undefined&&(typeof m[k]!=='string'||m[k].length>20000))throw Error('Detalhe de marco inválido: '+k);if(m.completedDate!==undefined)dates(m,['completedDate']);if(m.linkedUpdateId&&!p.updates.some(u=>u.id===m.linkedUpdateId))throw Error('Atualização vinculada ao marco não encontrada.');if(typeof m.done!=='boolean'||!m.title.trim())throw Error('Marco inválido.')}}return migrateState(raw);
}

async function importJSON(file){if(!file)return;if(demo)return toast('Saia da demonstração antes de importar.');if(!ensureEditable())return;if(file.size>20*1024*1024)return toast('Arquivo excede o limite de 20 MB.');try{const incoming=validateState(JSON.parse(await file.text()));if(!confirm('Substituir toda a base atual por '+incoming.projects.length+' projeto(s) do backup? Exporte seu backup atual antes, se necessário.'))return;const documentId=state.documentId,revision=state.revision;state={...incoming,documentId,revision};selected='all';touch();toast('Backup importado. Todos os indicadores foram recalculados.')}catch(e){toast('Não foi possível importar: '+e.message)}finally{$('#jsonInput').value=''}}
function csvExport(){if(!ensureEditable())return;if(demo)return toast('Saia da demonstração para exportar os dados reais.');const rows=[['Projeto','Área','Responsável','Status','Prioridade','Horas previstas','Horas realizadas','Avanço por horas (%)','Custo realizado (R$)','Orçamento (R$)','Prazo','Benefício anual esperado (R$)','Custeio de horas ativo','Ganho de horas esperado (h/ano)','Equivalente mensal (h/mês)','Memória do ganho de horas'],...state.projects.map(p=>{const m=metrics([p]);return [p.name,p.area,p.owner,p.status,p.priority,p.plannedHours??'',m.hours,m.progress??'',m.cost,p.budget??'',p.end,p.annualMoney??'',hourCostEnabled(p)?'Sim':'Não',p.annualHours??'',hasHoursBenefit(p)?n(p.annualHours)/12:'',p.savingsMethod||'']})];const cell=v=>{let s=typeof v==='number'?String(v).replace('.',','):String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};downloadBlob('\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8','GDM_Tax_Projetos_'+today()+'.csv')}
function demoData(){const now=today(),w=monday(now);const specs=[['Automação da conciliação fiscal','ICMS','Em desenvolvimento','Alta',180,96,24000,320,42000],['Governança de documentos fiscais','Compliance','Em homologação','Alta',120,102,18000,210,28000],['Inteligência de créditos tributários','Tax Analytics','Planejado','Média',240,24,36000,180,65000]];return specs.map((s,i)=>{const p={id:uid(),name:s[0],area:s[1],owner:['Ana • exemplo','Bruno • exemplo','Carla • exemplo'][i],sponsor:'Gestão Tributária • exemplo',description:['Conciliação automatizada de livros fiscais com o razão contábil, priorizando divergências para análise.','Centralização de regras, validações e evidências de documentos fiscais em um processo rastreável.','Estruturação de dados e critérios para identificar oportunidades e acompanhar créditos tributários.'][i],status:s[2],priority:s[3],start:addDays(now,-45),end:addDays(now,i===0?21:i===1?7:60),completedDate:'',plannedHours:s[4],baseHours:0,baseCost:1000*(i+1),hourlyRate:100,hourCostEnabled:true,savingsMethod:'Redução estimada de esforço mensal × 12 meses. Exemplo demonstrativo.',budget:s[6],benefits:'Redução de esforço manual, rastreabilidade das análises e maior confiabilidade dos dados.',expectedResults:'Validar as regras em homologação e documentar critérios de aceite com a área fiscal.',annualHours:s[7],annualMoney:s[8],attention:'Dados fictícios usados exclusivamente para demonstrar a aplicação.',nextSteps:'Concluir validação técnica e alinhar critérios de aceite.',milestones:[{id:uid(),title:'Escopo e requisitos validados',due:addDays(now,-21),owner:'Equipe Tax • exemplo',done:true},{id:uid(),title:'Validação em homologação',due:addDays(now,7),owner:'Equipe Tax • exemplo',done:i===1},{id:uid(),title:'Entrada em produção',due:addDays(now,21),owner:'Equipe Tax • exemplo',done:false}],risks:i===0?[{id:uid(),title:'Disponibilidade de dados para homologação',severity:'Alto',status:'Em tratamento',mitigation:'Agendar extração com TI e validar o conjunto de testes.',owner:'Equipe Tax • exemplo',due:addDays(now,5)}]:[],updates:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};for(let k=0;k<4;k++)p.updates.push({id:uid(),week:addDays(w,-(3-k)*7),date:addDays(w,-(3-k)*7),summary:['Requisitos detalhados e alinhados.','Desenvolvimento das regras prioritárias.','Validação dos resultados parciais.','Evolução técnica e preparação dos próximos testes.'][k],achievements:'Revisão das regras e documentação das evidências. Alinhamento com as áreas envolvidas.',attention:i===0?'Dependência de extração de dados em tratamento.':'Sem bloqueios reportados nesta semana.',nextSteps:'Validar a próxima entrega e registrar o aceite dos responsáveis.',hours:s[5]/4,expenses:300+i*150,health:i===0?'Atenção':'No ritmo',author:p.owner,updatedAt:new Date().toISOString()});return p})}
async function toggleDemo(){if(recoveryIssue||cacheCandidate)return toast('Resolva a recuperação dos dados antes de abrir a demonstração.');if(demo){state=restoreState;restoreState=null;demo=false;selected='all';render();return}if(fileHandle){await enqueueWrite();await writeQueue}restoreState=state;state={schemaVersion:1,documentId:'demo',revision:0,updatedAt:null,projects:demoData()};demo=true;selected='all';currentView='executive';render()}
