function metrics(projects){
const planned=sum(projects,p=>p.plannedHours),hours=sum(projects,actualHours),budget=sum(projects,p=>p.budget),cost=sum(projects,actualCost);
const ms=projects.flatMap(p=>p.milestones),risks=projects.flatMap(p=>p.risks),open=risks.filter(r=>r.status!=='Resolvido');
const pct=planned>0?hours/planned*100:null;
return {planned,hours,budget,cost,pct,progress:pct===null?null:Math.min(100,pct),remaining:Math.max(0,planned-hours),overrun:Math.max(0,hours-planned),milestones:ms,done:ms.filter(m=>m.done).length,lateMilestones:ms.filter(m=>!m.done&&m.due&&m.due<today()).length,openRisks:open,critical:open.filter(r=>r.severity==='Alto'||r.severity==='Crítico').length,late:projects.filter(p=>active(p)&&p.end&&p.end<today()).length,annualMoney:sum(projects,p=>p.annualMoney),annualHours:sum(projects,p=>p.annualHours),closed:projects.filter(p=>p.status==='Concluído').length};
}
function health(p){if(p.status==='Concluído')return 'Concluído';if(p.status==='Cancelado')return 'Cancelado';const latest=[...p.updates].sort((a,b)=>b.week.localeCompare(a.week))[0];if(latest?.health==='Bloqueado'||p.risks.some(r=>r.status!=='Resolvido'&&r.severity==='Crítico'))return 'Bloqueado';if(p.status==='Pausado'||(p.end&&p.end<today())||actualHours(p)>n(p.plannedHours)&&n(p.plannedHours)>0||n(p.budget)>0&&actualCost(p)>n(p.budget)||latest?.health==='Atenção'||p.risks.some(r=>r.status!=='Resolvido'&&r.severity==='Alto'))return 'Atenção';return 'No ritmo'}

}
function updateSaveState(){let text=demo?'Demonstração • dados fictícios':saveError?'Falha ao gravar • baixe o HTML':writing?'Gravando no HTML…':fileHandle&&!dirtyFile?'HTML salvo • '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):fileHandle?'Alterações aguardando gravação':cacheOk?'Cópia local • HTML não vinculado':'Sem cópia local • baixe o HTML';
$('#saveState').innerHTML='<span class="dot '+(!fileHandle||saveError?'warning':'')+'"></span>'+esc(text);

function serialize(data=state){const encoded=JSON.stringify(data).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');return TEMPLATE.replace(/(<script id="app-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+encoded+b)}
function enqueueWrite(){clearTimeout(writeTimer);if(!fileHandle||demo)return writeQueue;const target=fileHandle;const snapshot=structuredClone(state);const body=serialize(snapshot);writing=true;updateSaveState();writeQueue=writeQueue.catch(()=>{}).then(async()=>{try{const writable=await target.createWritable();await writable.write(body);await writable.close();lastFileRevision=snapshot.revision;dirtyFile=state.revision!==snapshot.revision;saveError=''}catch(e){saveError=e.name+': '+e.message;dirtyFile=true;toast('Não foi possível gravar no arquivo. Use Baixar HTML para preservar os dados.')}finally{writing=false;updateSaveState()}});return writeQueue}

function downloadBlob(content,type,name){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}

ll" data-action="edit" data-id="'+p.id+'">Gerenciar</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="project-grid">'+ps.map(p=>{const m=metrics([p]);return '<article class="project-card"><div class="actions" style="justify-content:space-between">'+statusTag(p.status)+tag(p.priority,p.priority==='Crítica'?'red':p.priority==='Alta'?'copper':'')+'</div><div><div class="eyebrow muted" style="margin-bottom:8px">'+esc(p.area||'Tax Intelligence')+'</div><h3>'+esc(p.name)+'</h3><p style="margin-top:9px">'+esc(p.description||'Adicione o objetivo e o escopo desta iniciativa.')+'</p></div><div class="card-meta"><span>'+esc(p.owner||'Sem responsável')+'</span><span>'+date(p.end)+'</span></div><div><div class="progress-label"><span>Avanço por horas</span><b>'+(m.progress===null?'—':fmt(m.progress,1)+'%')+'</b></div>'+progress(m.progress)+'<div class="card-meta" style="margin-top:9px"><span>'+fmt(m.hours,1)+' / '+(m.planned?fmt(m.planned,1):'—')+' h</span><span>'+money(m.cost)+'</span></div></div><div class="savings-card">'+icon('clock')+'<span>'+esc(hoursBenefitText(p))+'<small>Economia esperada para a empresa</small></span></div><div class="card-foot"><button class="btn small" data-action="report" data-id="'+p.id+'">'+icon('dashboard')+'KPIs</button><button class="btn small primary" data-action="edit" data-id="'+p.id+'">Gerenciar '+icon('arrow')+'</button></div></article>'}).join('')+'</div>'):state.projects.length?'<div class="empty"><h3>Nenhum projeto encontrado.</h3><p>Ajuste a busca ou os filtros.</p></div>':empty());}
function weeklyView(){const ps=scoped(),entries=ps.flatMap(p=>p.updates.filter(u=>u.week===week).map(u=>({p,u})));return '<div class="view-head"><div><div class="eyebrow muted">Ritmo de execução</div><h1 style="margin-top:8px">Atualização semanal</h1><p>Novidades, avanços, investimentos e o que vem a seguir.</p></div><button class="btn primary" data-action="add-week">'+icon('plus')+'Registrar semana</button></div><div class="toolbar"><div class="actions"><button class="btn small" data-action="prev-week" aria-label="Semana anterior">←</button><label class="filter">Semana de <input type="date" id="weekFilter" value="'+week+'"></label><button class="btn small" data-action="next-week" aria-label="Próxima semana">→</button><span class="small muted">'+date(week)+' a '+date(addDays(week,6))+'</span></div>'+scopeFilter()+'</div><div class="stats">'+stat('Projetos atualizados',entries.length+' / '+ps.length,'Um registro por projeto e semana','folder')+stat('Horas da semana',fmt(sum(entries,x=>x.u.hours),1)+' h','Adicionadas ao acumulado','clock')+stat('Despesas da semana',shortMoney(sum(entries,x=>x.u.expenses)),'Exclui custo calculado das horas','coin')+stat('Custo total da semana',shortMoney(sum(entries,x=>n(x.u.expenses)+laborCost(x.p,x.u.hours))),'Despesas + custeio das horas, se ativado','trend')+'</div>'+entries.map(({p,u})=>'<article class="week-card"><div class="week-head"><div><div class="eyebrow muted">'+esc(p.area)+'</div><h3 style="font-size:20px;margin:5px 0 8px">'+esc(p.name)+'</h3><div class="actions">'+healthTag(u.health)+'<span class="small muted">'+fmt(u.hours,1)+' h · '+money(u.expenses)+' em despesas · '+esc(u.author||'Responsável não informado')+'</span></div></div><button class="btn small" data-action="edit-week" data-id="'+p.id+'" data-entry="'+u.id+'">'+icon('edit')+'Editar atualização</button></div><div class="week-body">'+textBlock('Resumo executivo',u.summary)+textBlock('Novidades e avanços',u.achievements)+textBlock('Pontos de atenção',u.attention)+textBlock('Próximos passos',u.nextSteps)+'</div></article>').join('')+(entries.length?'':'<div class="empty">'+icon('calendar')+'<h3>A semana está pronta para ser contada.</h3><p>Selecione um projeto e registre suas entregas, horas, despesas e próximos passos.</p><button class="btn primary" data-action="add-week">Registrar atualização</button></div>');}
function textBlock(title,text){return '<div class="text-block"><h4>'+esc(title)+'</h4><p>'+esc(text||'Não informado.')+'</p></div>'}
function helpView(){return '<div class="view-head"><div><div class="eyebrow muted">Seu centro de controle</div><h1 style="margin-top:8px">Dados e orientações</h1><p>Um arquivo completo. Um processo claro para manter seus projetos atualizados.</p></div></div><div class="help-grid"><section class="panel"><h3>'+icon('save')+' Salvar no próprio HTML</h3><ol><li>Baixe e abra este HTML no Microsoft Edge ou Google Chrome.</li><li>Clique em <b>Ativar gravação no HTML</b> e escolha o arquivo de destino. Você pode selecionar o próprio HTML aberto ou criar uma nova cópia.</li><li>Autorize a gravação quando o navegador solicitar. Cada alteração válida é gravada automaticamente após uma breve pausa.</li><li>Aguarde <b>HTML salvo</b> antes de fechar. Ao reabrir, ative a gravação novamente.</li></ol><div class="notice">O navegador não permite que um HTML sobrescreva arquivos sem sua autorização. Se a função não estiver disponível, use <b>Baixar HTML</b> para obter uma versão com todos os dados incorporados.</div><p>A cópia automática no navegador ajuda a recuperar alterações, mas não atualiza o arquivo físico. Use uma única aba de edição. Cópias distribuídas do HTML não são sincronizadas.</p><div class="actions" style="margin-top:16px"><button class="btn primary" data-action="connect">Ativar gravação</button><button class="btn" data-action="download">Baixar HTML atualizado</button></div></section><section class="panel"><h3>'+icon('shield')+' Backup e portabilidade</h3><p><b>Restaurar um backup:</b> clique em <b>Importar backup JSON</b>, selecione o arquivo exportado anteriormente e confirme a restauração. Projetos, horas, benefícios e histórico semanal serão recuperados. A importação substitui toda a base atual após sua confirmação. Exporte a base atual antes de substituí-la, se desejar preservá-la. Backups da versão anterior são compatíveis. O HTML também carrega seus próprios dados e a logo; funciona offline, sem bibliotecas externas.</p><div class="actions" style="margin:20px 0"><button class="btn" data-action="json-export">Exportar backup JSON</button><button class="btn primary" data-action="json-import">Importar backup JSON</button><button class="btn" data-action="csv">Exportar resumo CSV</button></div><p><b>Uso local e individual:</b> não há servidor, autenticação nem edição colaborativa. Quem recebe uma cópia do HTML pode visualizar os dados incorporados. Políticas corporativas podem limitar a gravação pelo navegador.</p><div class="notice">Para apresentar à liderança, filtre o projeto em <b>Visão executiva</b> e utilize <b>Imprimir / PDF</b>.</div><button class="btn" data-action="demo">'+(demo?'Sair da demonstração':'Explorar demonstração isolada')+'</button></section><section class="panel wide"><h3>Como os quatro painéis são calculados</h3><div class="table-wrap"><table><thead><tr><th>Painel</th><th>Indicadores e regras</th><th>Interpretação</th></tr></thead><tbody><tr><td><b>01 · Esforço & avanço</b></td><td>Horas realizadas = saldo inicial + horas semanais.<br>Avanço = mínimo(100%, realizadas ÷ previstas × 100).<br>Consumo = realizadas ÷ previstas × 100.</td><td>O percentual solicitado mede consumo de esforço.<br>A conclusão real é acompanhada por marcos e status.</td></tr><tr><td><b>02 · Prazo & entregas</b></td><td>Marcos concluídos ÷ total de marcos.<br>Atraso = data vencida e entrega pendente.</td><td>Marcos têm pesos iguais. Status concluído é manual.<br>O prazo não determina sozinho o avanço.</td></tr><tr><td><b>03 · Custos & orçamento</b></td><td>Custo = despesas iniciais + despesas semanais + horas realizadas × custo/hora, somente se o custeio estiver ativado.<br>Saldo = orçamento − custo. Consumo = custo ÷ orçamento.</td><td>Custeio de horas é opcional por projeto; novos projetos começam desativados.<br>Alterar a taxa recalcula todas as horas históricas.<br>Desativar preserva a taxa e os registros de horas.<br>Valores negativos de saldo mostram estouro.</td></tr><tr><td><b>04 · Benefícios & riscos</b></td><td>Ganho anual de horas cadastrado por projeto; equivalente mensal = anual ÷ 12.<br>Benefício financeiro anual esperado.<br>Riscos abertos, altos e críticos; cobertura de atualizações.</td><td>Ganhos de horas permanecem ativos com ou sem custeio.<br>Benefícios não são somados ao investimento.<br>Não há ROI ou valor agregado sem medição real.<br>Saúde é um sinal de gestão, não uma previsão.</td></tr></tbody></table></div><div class="notice"><b>Dados não informados:</b> campos sem base de cálculo exibem “—” ou “Não informado”. Consolidados somam apenas valores informados; um orçamento parcial pode distorcer a leitura do portfólio. Cadastre horas e orçamento de todos os projetos para comparações consistentes.</div><p><b>Saúde do projeto:</b> Bloqueado se o último status semanal for bloqueado ou existir risco crítico aberto. Atenção se houver pausa, atraso, excesso de horas, excesso de orçamento, risco alto ou status semanal de atenção. Nos demais casos: No ritmo. Concluídos e cancelados conservam seus próprios estados.</p></section><section class="panel wide"><h3>Referências de mercado e critérios de escolha</h3><p>Os painéis combinam as dimensões de tempo, orçamento, entregas e riscos presentes em soluções de gestão. A seleção foi adaptada ao acompanhamento de desenvolvimento de Tax Intelligence e evita indicadores que exigiriam dados não coletados.</p><ul><li><a href="https://asana.com/features/resource-management/timesheets-budgets" target="_blank" rel="noopener noreferrer">Asana — Timesheets and budgets</a>: comparação de horas, custos estimados e realizados.</li><li><a href="https://www.atlassian.com/software/jira/features/project-dashboard" target="_blank" rel="noopener noreferrer">Atlassian Jira — Project dashboard</a>: status, orçamento e aderência ao cronograma.</li><li><a href="https://www.atlassian.com/work-management/project-management/project-progress" target="_blank" rel="noopener noreferrer">Atlassian — Project progress</a>: marcos, atualizações e tratamento de riscos.</li><li><a href="https://developer.chrome.com/docs/capabilities/web-apis/file-system-access" target="_blank" rel="noopener noreferrer">Chrome Developers — File System Access</a>: autorização e gravação de arquivos pelo navegador.</li></ul><p>Referências consultadas em 15/10/2026. Os links são opcionais e exigem internet; a aplicação funciona sem eles.</p></section></div>'}
function render(){if(selected!=='all'&&!projectById(selected))selected='all';$('#view').innerHTML=({executive,projects:projectsView,weekly:weeklyView,help:helpView}[currentView])();$('#crumb').textContent={executive:'Visão executiva',projects:'Projetos',weekly:'Atualização semanal',help:'Dados e orientações'}[currentView];$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===currentView));$('#alerts').innerHTML=(demo?'<div class="banner"><div><strong>Demonstração • dados fictícios</strong>Explore o funcionamento. As alterações neste modo não afetam sua base real.</div><button class="btn small" data-action="demo">Voltar à minha base</button></div>':'')+(cacheCandidate?'<div class="banner warn"><div><strong>Há uma cópia local mais recente.</strong>Recupere as alterações deste navegador ou mantenha os dados incorporados no HTML.</div><div class="actions"><button class="btn small primary" data-action="recover">Recuperar alterações</button><button class="btn small" data-action="discard-recovery">Manter arquivo</button></div></div>':'');$('#footerDate').textContent=state.updatedAt?'Última alteração: '+new Date(state.updatedAt).toLocaleString('pt-BR'):'Pronto para seu primeiro projeto';updateSaveState();$$('[data-icon]').forEach(x=>x.innerHTML=icon(x.dataset.icon));}
function field(label,key,value,type='text',hint='',wide=false,options=null){const id='field-'+key;return '<label class="field '+(wide?'wide':'')+'" for="'+id+'">'+esc(label)+(options?'<select id="'+id+'" name="'+key+'">'+options.map(o=>'<option '+(o===value?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':type==='textarea'?'<textarea id="'+id+'" name="'+key+'" maxlength="20000">'+esc(value)+'</textarea>':'<input id="'+id+'" name="'+key+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'min="0" max="1000000000000" step="0.01"':type==='text'?'maxlength="240"':'')+'>')+(hint?'<small>'+esc(hint)+'</small>':'')+'</label>'}
function openProject(id,tab='general'){if(!ensureEditable())return;editingProject=id;projectTab=tab;paintProjectEditor();if(!$('#editor').open)$('#editor').showModal()}
function paintProjectEditor(){const p=projectById(editingProject);if(!p)return;const tabs={general:'Visão geral',resources:'Horas e custos',benefits:'Ganhos e benefícios',milestones:'Entregas',risks:'Pontos de atenção',history:'Histórico semanal'};let body='';
if(projectTab==='general')body='<div class="form-grid">'+field('Nome do projeto *','name',p.name,'text','Até 240 caracteres.',true)+field('Área','area',p.area)+field('Responsável','owner',p.owner)+field('Sponsor / patrocinador','sponsor',p.sponsor)+field('Prioridade','priority',p.priority,'text','',false,priorities)+field('Status do projeto','status',p.status,'text','Conclusão é uma decisão de gestão, não automática.',false,statusList)+field('Data de início','start',p.start,'date')+field('Prazo final','end',p.end,'date')+field('Data da conclusão efetiva','completedDate',p.completedDate,'date')+field('Objetivo e escopo','description',p.description,'textarea','',true)+field('Próximos passos gerais','nextSteps',p.nextSteps,'textarea','O painel prioriza próximos passos do registro semanal mais recente que os contenha.',true)+'</div>';
if(projectTab==='resources'){const m=metrics([p]);body='<div class="notice">Os totais somam o saldo inicial às atualizações semanais. Ao editar uma semana, seu valor anterior é substituído: não há duplicidade.</div><div class="form-grid">'+field('Horas necessárias / planejadas','plannedHours',p.plannedHours,'number','Estimativa total de desenvolvimento.')+field('Horas já gastas antes dos registros semanais','baseHours',p.baseHours,'number','Saldo inicial. Não inclua novamente horas registradas nas semanas.')+field('Orçamento total aprovado (R$)','budget',p.budget,'number','Inclua horas no orçamento se o custeio estiver ativado, além das despesas.')+field('Despesas anteriores às semanas (R$)','baseCost',p.baseCost,'number','Se o custeio de horas estiver ativo, exclua a mão de obra já calculada.',true)+'</div><div class="cost-toggle"><label class="switch-label"><input type="checkbox" role="switch" name="hourCostEnabled" '+(hourCostEnabled(p)?'checked':'')+'><span><b>Calcular custo das horas de desenvolvimento</b><small>Opcional por projeto. Ative para incluir horas × custo/hora no investimento.</small></span></label><p class="small muted" id="costToggleHint">'+(hourCostEnabled(p)?'Ativado: o investimento inclui mão de obra e despesas.':'Desativado: o investimento considera somente despesas. Horas de desenvolvimento e ganhos de horas continuam disponíveis.')+'</p><div id="hourlyRateSection" class="'+(hourCostEnabled(p)?'':'hidden')+'" style="margin-top:14px">'+field('Custo por hora (R$)','hourlyRate',p.hourlyRate,'number','Taxa única: alterações recalculam todas as horas do projeto. O valor é preservado quando a opção é desativada.')+'</div></div><div id="resourceSummary" class="stats" style="grid-template-columns:repeat(3,1fr)">'+stat('Horas acumuladas',fmt(m.hours,1)+' h','Saldo inicial + registros semanais','clock')+stat('Avanço por horas',m.progress===null?'—':fmt(m.progress,1)+'%','Não mede entregas concluídas','trend')+stat('Custo acumulado',shortMoney(m.cost),'Horas + despesas','coin')+'</div><button class="btn" data-action="add-week" data-id="'+p.id+'">'+icon('plus')+'Adicionar horas / despesas da semana</button>'}
if(projectTab==='benefits')body='<div id="savingsSummary">'+savingsSummary(p)+'</div><div class="form-grid">'+field('Ganho / redução de horas esperado por ano','annualHours',p.annualHours,'number','Informe o total anual de horas que a empresa deixará de gastar. Ex.: 40 h/mês × 12 = 480 h/ano.',true)+field('Como o ganho de horas será obtido / memória de cálculo','savingsMethod',p.savingsMethod,'textarea','Descreva a atividade, esforço atual, esforço após o projeto e frequência. Ex.: de 60 para 20 h/mês = 480 h/ano.',true)+field('Benefícios para o negócio','benefits',p.benefits,'textarea','Ex.: reduzir esforço manual, elevar rastreabilidade, mitigar exposição fiscal.',true)+field('Resultados esperados / critérios de sucesso','expectedResults',p.expectedResults,'textarea','Defina resultados mensuráveis e como serão validados.',true)+field('Benefício financeiro esperado por ano (R$)','annualMoney',p.annualMoney,'number','Opcional. Estimativa independente: as horas economizadas não são convertidas automaticamente em dinheiro.',true)+'</div><div class="notice">O ganho de horas fica disponível mesmo com o custo/hora desativado. É um benefício esperado para a empresa, separado das horas gastas no desenvolvimento.</div>';
if(projectTab==='milestones')body='<div class="subhead"><p>Marcos verificáveis para medir entregas reais.</p><button class="btn primary small" data-action="add-milestone" data-id="'+p.id+'">'+icon('plus')+'Novo marco</button></div>'+p.milestones.map(m=>'<div class="dialog-row"><div>'+tag(m.done?'Concluído':m.due&&m.due<today()?'Atrasado':'Pendente',m.done?'lime':m.due&&m.due<today()?'copper':'')+'<b>'+esc(m.title)+'</b><p>'+date(m.due)+' · '+esc(m.owner||'Sem responsável')+'</p></div><div class="actions"><label class="small"><input type="checkbox" data-toggle-milestone="'+m.id+'" '+(m.done?'checked':'')+'> Concluído</label><button class="btn small" data-action="edit-milestone" data-id="'+p.id+'" data-entry="'+m.id+'">Editar</button></div></div>').join('')+(!p.milestones.length?'<div class="empty"><p>Nenhuma entrega cadastrada. Adicione marcos como homologação, validação fiscal e entrada em produção.</p></div>':'');
if(projectTab==='risks')body='<div class="form-grid" style="margin-bottom:23px">'+field('Pontos de atenção gerais','attention',p.attention,'textarea','Contexto executivo adicional aos riscos estruturados.',true)+'</div><div class="subhead"><p>Riscos, responsáveis e medidas de mitigação.</p><button class="btn primary small" data-action="add-risk" data-id="'+p.id+'">'+icon('plus')+'Novo risco</button></div>'+p.risks.map(r=>'<div class="dialog-row"><div>'+tag(r.severity,r.severity==='Crítico'?'red':r.severity==='Alto'?'copper':'')+' '+tag(r.status,r.status==='Resolvido'?'lime':'')+'<b>'+esc(r.title)+'</b><p>'+esc(r.mitigation||'Defina uma ação de mitigação.')+'</p><p>'+esc(r.owner||'Sem responsável')+' · '+date(r.due)+'</p></div><button class="btn small" data-action="edit-risk" data-id="'+p.id+'" data-entry="'+r.id+'">Editar</button></div>').join('')+(!p.risks.length?'<p class="small muted">Nenhum risco estruturado cadastrado.</p>':'');
if(projectTab==='history')body='<div class="subhead"><p>Histórico completo das atualizações do projeto.</p><button class="btn primary small" data-action="add-week" data-id="'+p.id+'">'+icon('plus')+'Registrar semana</button></div>'+[...p.updates].sort((a,b)=>b.week.localeCompare(a.week)).map(u=>'<div class="dialog-row"><div><div class="actions">'+healthTag(u.health)+'<span class="small muted">Semana de '+date(u.week)+'</span></div><b>'+esc(u.summary||'Atualização semanal')+'</b><p>'+fmt(u.hours,1)+' h · '+money(u.expenses)+' em despesas</p></div><button class="btn small" data-action="edit-week" data-id="'+p.id+'" data-entry="'+u.id+'">Editar</button></div>').join('')+(!p.updates.length?'<div class="empty"><p>Registre a primeira semana para construir o histórico de desenvolvimento.</p></div>':'');
$('#editor').innerHTML='<div class="dialog-head"><div><div class="eyebrow muted">Gestão do projeto</div><h2 id="editorTitle">'+esc(p.name)+'</h2><p>Alterações válidas são salvas automaticamente. Use os campos para editar.</p></div><button class="close" data-action="close-editor" aria-label="Fechar">'+icon('close')+'</button></div><div class="dialog-tabs" role="tablist">'+Object.entries(tabs).map(([key,label])=>'<button role="tab" aria-selected="'+(projectTab===key)+'" data-tab="'+key+'" class="'+(projectTab===key?'active':'')+'">'+label+'</button>').join('')+'</div><div class="dialog-body"><form id="projectForm" onsubmit="return false">'+body+'</form></div><div class="dialog-foot"><button class="btn small danger" data-action="delete-project" data-id="'+p.id+'">Excluir projeto</button><div class="actions"><span class="small muted" id="fieldStatus">'+(demo?'Demonstração':'Salvamento automático')+'</span><button class="btn primary" data-action="close-editor">Concluir edição</button></div></div>';
if(projectTab==='resources')$('#field-hourlyRate').disabled=!hourCostEnabled(p);
}
function closeEditor(){if($('#projectForm')&&!validateEditorFields($('#projectForm')))return;$('#editor').close();editingProject=null;render();if(fileHandle)enqueueWrite()}
function validateEditorFields(form){for(const x of $$('input,textarea,select',form)){if(!x.checkValidity()){x.reportValidity();return false}}return true}
function openEntry(type,pid,id){if(!ensureEditable())return;if(!state.projects.length)return toast('Cadastre um projeto primeiro.');if(!pid&&selected==='all'){entryContext=null;$('#entryEditor').innerHTML='<div class="dialog-head"><div><div class="eyebrow muted">Atualização semanal</div><h2 id="entryTitle">Selecione o projeto</h2><p>Semana de '+date(week)+'</p></div><button class="close" data-action="close-entry" aria-label="Fechar">'+icon('close')+'</button></div><div class="dialog-body"><label class="field">Projeto<select id="chooseWeekProject">'+projectOptions(false)+'</select></label></div><div class="dialog-foot"><p>Um registro por projeto e semana.</p><button class="btn primary" data-action="start-week">Continuar</button></div>';if(!$('#entryEditor').open)$('#entryEditor').showModal();return}if(!pid){pid=selected}const p=projectById(pid);if(!p)return;const collection=type==='week'?'updates':type==='risk'?'risks':'milestones';let entry=id?p[collection].find(x=>x.id===id):null;if(type==='week'&&!entry)entry=p.updates.find(u=>u.week===week);if(!entry){entry=type==='week'?{id:uid(),week,summary:'',achievements:'',attention:'',nextSteps:'',hours:0,expenses:0,health:'No ritmo',author:p.owner,updatedAt:new Date().toISOString()}:type==='risk'?{id:uid(),title:'Novo risco',severity:'Médio',status:'Aberto',mitigation:'',owner:p.owner,due:''}:{id:uid(),title:'Nova entrega',due:'',owner:p.owner,done:false};p[collection].push(entry);p.updatedAt=new Date().toISOString();touch()}
entryContext={type,pid,id:entry.id,collection};paintEntry();if(!$('#entryEditor').open)$('#entryEditor').showModal()}
function paintEntry(){const {type,pid,id,collection}=entryContext;const p=projectById(pid),e=p[collection].find(x=>x.id===id);let body='';if(type==='week')body='<label class="field wide">Projeto<select id="entryProject">'+state.projects.map(x=>'<option value="'+x.id+'" '+(x.id===pid?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><small>Trocar o projeto abre o registro da mesma semana no projeto selecionado.</small></label>'+field('Semana (selecione qualquer dia)','week',e.week,'date','O registro é agrupado pela segunda-feira. Não é permitido duplicar uma semana.')+field('Saúde reportada','health',e.health,'text','',false,healthList)+field('Horas gastas nesta semana','hours',e.hours,'number','Somadas ao saldo inicial do projeto.')+field('Despesas adicionais da semana (R$)','expenses',e.expenses,'number','Se o custeio estiver ativo, exclua a mão de obra já calculada por horas × custo/hora.')+field('Atualizado por','author',e.author,'text','',true)+field('Resumo executivo / status','summary',e.summary,'textarea','',true)+field('Novidades e avanços da semana','achievements',e.achievements,'textarea','',true)+field('Pontos de atenção da semana','attention',e.attention,'textarea','',true)+field('Próximos passos','nextSteps',e.nextSteps,'textarea','Descreva a ação, responsável e prazo, quando aplicável.',true);
if(type==='risk')body=field('Descrição do risco *','title',e.title,'text','',true)+field('Severidade','severity',e.severity,'text','',false,['Baixo','Médio','Alto','Crítico'])+field('Situação','status',e.status,'text','',false,['Aberto','Em tratamento','Resolvido'])+field('Responsável','owner',e.owner)+field('Prazo de mitigação','due',e.due,'date')+field('Plano de mitigação / ação','mitigation',e.mitigation,'textarea','',true);
if(type==='milestone')body=field('Nome da entrega *','title',e.title,'text','',true)+field('Prazo','due',e.due,'date')+field('Responsável','owner',e.owner)+'<label class="field wide"><span><input type="checkbox" name="done" '+(e.done?'checked':'')+'> Entrega concluída</span></label>';
$('#entryEditor').innerHTML='<div class="dialog-head"><div><div class="eyebrow muted">'+esc(p.name)+'</div><h2 id="entryTitle">'+({week:'Atualização da semana',risk:'Ponto de atenção',milestone:'Marco de entrega'}[type])+'</h2><p>Alterações válidas são salvas automaticamente.</p></div><button class="close" data-action="close-entry" aria-label="Fechar">'+icon('close')+'</button></div><div class="dialog-body"><form id="entryForm" class="form-grid" onsubmit="return false">'+body+'</form></div><div class="dialog-foot"><button class="btn small danger" data-action="delete-entry">Excluir registro</button><div class="actions"><span id="entryStatus" class="small muted">Salvamento automático</span><button class="btn primary" data-action="close-entry">Concluir registro</button></div></div>'}
function closeEntry(){if($('#entryForm')&&!validateEditorFields($('#entryForm')))return;$('#entryEditor').close();entryContext=null;if(editingProject)paintProjectEditor();render();if(fileHandle)enqueueWrite()}
function handleField(event){const el=event.target;if(!el.name)return;const inProject=!!el.closest('#projectForm'),inEntry=!!el.closest('#entryForm');if(!inProject&&!inEntry)return;const p=projectById(inProject?editingProject:entryContext.pid);if(!p)return;const target=inProject?p:p[entryContext.collection].find(x=>x.id===entryContext.id);const key=el.name;let value=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?null:Number(el.value)):el.value;el.setCustomValidity('');const statusEl=inProject?$('#fieldStatus'):$('#entryStatus');
if((key==='name'||key==='title')&&!String(value).trim())el.setCustomValidity('Preencha este campo antes de concluir.');
if(key==='week'){if(!value)el.setCustomValidity('Selecione uma data.');else{value=monday(value);if(p.updates.some(u=>u.id!==target.id&&u.week===value))el.setCustomValidity('Já existe uma atualização para esta semana. Edite o registro existente.')}}
if(inProject&&key==='end'&&value&&p.start&&value<p.start)el.setCustomValidity('O prazo final não pode ser anterior ao início.');
if(inProject&&key==='start'&&value&&p.end&&value>p.end)el.setCustomValidity('O início não pode ser posterior ao prazo final.');
if(!el.checkValidity()){statusEl.textContent='Campo inválido • ainda não salvo';return}
target[key]=value;target.updatedAt=new Date().toISOString();p.updatedAt=new Date().toISOString();if(inProject&&key==='status'&&value==='Concluído'&&!p.completedDate)p.completedDate=today();touch();statusEl.textContent=demo?'Demonstração alterada':fileHandle?'Gravação automática em andamento':cacheOk?'Alteração salva no navegador':'Sem cópia local: baixe o HTML';if(key==='name')$('#editorTitle').textContent=value;if(inProject&&key==='hourCostEnabled'){$('#field-hourlyRate').disabled=!value;$('#field-hourlyRate').value=p.hourlyRate;$('#field-hourlyRate').setCustomValidity('');$('#hourlyRateSection').classList.toggle('hidden',!value);$('#costToggleHint').textContent=value?'Ativado: o investimento inclui mão de obra e despesas.':'Desativado: o investimento considera somente despesas. Horas de desenvolvimento e ganhos de horas continuam disponíveis.'}if(inProject&&key==='annualHours'&&$('#savingsSummary'))$('#savingsSummary').innerHTML=savingsSummary(p);if(inProject&&projectTab==='resources'&&$('#resourceSummary')){const m=metrics([p]);$('#resourceSummary').innerHTML=stat('Horas acumuladas',fmt(m.hours,1)+' h','Saldo inicial + registros semanais','clock')+stat('Avanço por horas',m.progress===null?'—':fmt(m.progress,1)+'%','Não mede entregas concluídas','trend')+stat('Custo acumulado',shortMoney(m.cost),'Horas + despesas','coin');}
}
function validateState(raw){
if(!raw||raw.schemaVersion!==1||typeof raw.documentId!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(raw.documentId)||!Number.isInteger(raw.revision)||raw.revision<0||!Array.isArray(raw.projects)||raw.projects.length>2000)throw Error('Estrutura de backup incompatível.');
const strings=(o,keys,max=20000)=>keys.forEach(k=>{if(typeof o[k]!=='string'||o[k].length>max)throw Error('Campo de texto inválido: '+k)});
const nums=(o,keys)=>keys.forEach(k=>{if(o[k]!==null&&(typeof o[k]!=='number'||!Number.isFinite(o[k])||o[k]<0||o[k]>1e12))throw Error('Valor numérico inválido: '+k)});
const dates=(o,keys)=>keys.forEach(k=>{if(o[k]!==''&&(!/^\d{4}-\d{2}-\d{2}$/.test(o[k])||!Number.isFinite(day(o[k]).getTime())||day(o[k]).toISOString().slice(0,10)!==o[k]))throw Error('Data inválida: '+k)});
const unique=new Set();const id=o=>{if(typeof o.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(o.id)||unique.has(o.id))throw Error('Identificador inválido ou repetido.');unique.add(o.id)};
for(const p of raw.projects){if(p.hourCostEnabled!==undefined&&typeof p.hourCostEnabled!=='boolean')throw Error('Opção de custeio inválida.');if(p.savingsMethod!==undefined&&(typeof p.savingsMethod!=='string'||p.savingsMethod.length>20000))throw Error('Memória de cálculo inválida.');id(p);strings(p,['name','area','owner','sponsor','description','benefits','expectedResults','attention','nextSteps','status','priority','start','end','completedDate']);if(!p.name.trim()||!statusList.includes(p.status)||!priorities.includes(p.priority))throw Error('Projeto ou status inválido.');nums(p,['plannedHours','baseHours','baseCost','hourlyRate','budget','annualHours','annualMoney']);dates(p,['start','end','completedDate']);if(p.start&&p.end&&p.start>p.end)throw Error('Datas do projeto inconsistentes.');for(const a of ['updates','risks','milestones'])if(!Array.isArray(p[a])||p[a].length>10000)throw Error('Registros inválidos.');const weeks=new Set();for(const u of p.updates){id(u);strings(u,['week','summary','achievements','attention','nextSteps','health','author']);nums(u,['hours','expenses']);dates(u,['week']);if(!u.week||monday(u.week)!==u.week||weeks.has(u.week)||!healthList.includes(u.health))throw Error('Semana duplicada ou inválida.');weeks.add(u.week)}for(const r of p.risks){id(r);strings(r,['title','severity','status','mitigation','owner','due']);dates(r,['due']);if(!['Baixo','Médio','Alto','Crítico'].includes(r.severity)||!['Aberto','Em tratamento','Resolvido'].includes(r.status)||!r.title.trim())throw Error('Risco inválido.')}for(const m of p.milestones){id(m);strings(m,['title','due','owner']);dates(m,['due']);if(typeof m.done!=='boolean'||!m.title.trim())throw Error('Marco inválido.')}}return migrateState(raw);
}
function exportJSON(){if(!ensureEditable())return;if(demo)return toast('Saia da demonstração para exportar os dados reais.');downloadBlob(JSON.stringify(state,null,2),'application/json','GDM_Tax_Backup_'+today()+'.json')}
async function importJSON(file){if(!file)return;if(demo)return toast('Saia da demonstração antes de importar.');if(!ensureEditable())return;if(file.size>20*1024*1024)return toast('Arquivo excede o limite de 20 MB.');try{const incoming=validateState(JSON.parse(await file.text()));if(!confirm('Substituir toda a base atual por '+incoming.projects.length+' projeto(s) do backup? Exporte seu backup atual antes, se necessário.'))return;const documentId=state.documentId,revision=state.revision;state={...incoming,documentId,revision};selected='all';touch();toast('Backup importado. Todos os indicadores foram recalculados.')}catch(e){toast('Não foi possível importar: '+e.message)}finally{$('#jsonInput').value=''}}
function csvExport(){if(!ensureEditable())return;if(demo)return toast('Saia da demonstração para exportar os dados reais.');const rows=[['Projeto','Área','Responsável','Status','Prioridade','Horas previstas','Horas realizadas','Avanço por horas (%)','Custo realizado (R$)','Orçamento (R$)','Prazo','Benefício anual esperado (R$)','Custeio de horas ativo','Ganho de horas esperado (h/ano)','Equivalente mensal (h/mês)','Memória do ganho de horas'],...state.projects.map(p=>{const m=metrics([p]);return [p.name,p.area,p.owner,p.status,p.priority,p.plannedHours??'',m.hours,m.progress??'',m.cost,p.budget??'',p.end,p.annualMoney??'',hourCostEnabled(p)?'Sim':'Não',p.annualHours??'',hasHoursBenefit(p)?n(p.annualHours)/12:'',p.savingsMethod||'']})];const cell=v=>{let s=typeof v==='number'?String(v).replace('.',','):String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};downloadBlob('\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8','GDM_Tax_Projetos_'+today()+'.csv')}
function demoData(){const now=today(),w=monday(now);const specs=[['Automação da conciliação fiscal','ICMS','Em desenvolvimento','Alta',180,96,24000,320,42000],['Governança de documentos fiscais','Compliance','Em homologação','Alta',120,102,18000,210,28000],['Inteligência de créditos tributários','Tax Analytics','Planejado','Média',240,24,36000,180,65000]];return specs.map((s,i)=>{const p={id:uid(),name:s[0],area:s[1],owner:['Ana • exemplo','Bruno • exemplo','Carla • exemplo'][i],sponsor:'Gestão Tributária • exemplo',description:['Conciliação automatizada de livros fiscais com o razão contábil, priorizando divergências para análise.','Centralização de regras, validações e evidências de documentos fiscais em um processo rastreável.','Estruturação de dados e critérios para identificar oportunidades e acompanhar créditos tributários.'][i],status:s[2],priority:s[3],start:addDays(now,-45),end:addDays(now,i===0?21:i===1?7:60),completedDate:'',plannedHours:s[4],baseHours:0,baseCost:1000*(i+1),hourlyRate:100,hourCostEnabled:true,savingsMethod:'Redução estimada de esforço mensal × 12 meses. Exemplo demonstrativo.',budget:s[6],benefits:'Redução de esforço manual, rastreabilidade das análises e maior confiabilidade dos dados.',expectedResults:'Validar as regras em homologação e documentar critérios de aceite com a área fiscal.',annualHours:s[7],annualMoney:s[8],attention:'Dados fictícios usados exclusivamente para demonstrar a aplicação.',nextSteps:'Concluir validação técnica e alinhar critérios de aceite.',milestones:[{id:uid(),title:'Escopo e requisitos validados',due:addDays(now,-21),owner:'Equipe Tax • exemplo',done:true},{id:uid(),title:'Validação em homologação',due:addDays(now,7),owner:'Equipe Tax • exemplo',done:i===1},{id:uid(),title:'Entrada em produção',due:addDays(now,21),owner:'Equipe Tax • exemplo',done:false}],risks:i===0?[{id:uid(),title:'Disponibilidade de dados para homologação',severity:'Alto',status:'Em tratamento',mitigation:'Agendar extração com TI e validar o conjunto de testes.',owner:'Equipe Tax • exemplo',due:addDays(now,5)}]:[],updates:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};for(let k=0;k<4;k++)p.updates.push({id:uid(),week:addDays(w,-(3-k)*7),summary:['Requisitos detalhados e alinhados.','Desenvolvimento das regras prioritárias.','Validação dos resultados parciais.','Evolução técnica e preparação dos próximos testes.'][k],achievements:'Revisão das regras e documentação das evidências. Alinhamento com as áreas envolvidas.',attention:i===0?'Dependência de extração de dados em tratamento.':'Sem bloqueios reportados nesta semana.',nextSteps:'Validar a próxima entrega e registrar o aceite dos responsáveis.',hours:s[5]/4,expenses:300+i*150,health:i===0?'Atenção':'No ritmo',author:p.owner,updatedAt:new Date().toISOString()});return p})}
async function toggleDemo(){if(cacheCandidate)return toast('Resolva a recuperação dos dados antes de abrir a demonstração.');if(demo){state=restoreState;restoreState=null;demo=false;selected='all';render();return}if(fileHandle){await enqueueWrite();await writeQueue}restoreState=state;state={schemaVersion:1,documentId:'demo',revision:0,updatedAt:null,projects:demoData()};demo=true;selected='all';currentView='executive';render()}
document.addEventListener('click',async ev=>{const tab=ev.target.closest('[data-tab]');if(tab){if(!validateEditorFields($('#projectForm')))return;projectTab=tab.dataset.tab;paintProjectEditor();return}const nav=ev.target.closest('[data-nav]');if(nav){currentView=nav.dataset.nav;render();return}const btn=ev.target.closest('[data-action]');if(!btn)return;const {action,id,entry}=btn.dataset;
if(action==='new')newProject();else if(action==='edit')openProject(id);else if(action==='report'){selected=id;currentView='executive';render()}else if(action==='download')downloadHTML();else if(action==='connect')connectFile();else if(action==='cards'||action==='list'){listMode=action==='list';render()}else if(action==='print')window.print();else if(action==='close-editor')closeEditor();else if(action==='close-entry')closeEntry();else if(action==='start-week')openEntry('week',$('#chooseWeekProject').value);else if(action==='add-week'||action==='edit-week')openEntry('week',id,entry);else if(action==='add-risk'||action==='edit-risk')openEntry('risk',id,entry);else if(action==='add-milestone'||action==='edit-milestone')openEntry('milestone',id,entry);else if(action==='delete-project'){if(confirm('Excluir o projeto e todo o seu histórico? Esta ação não pode ser desfeita nesta sessão.')){state.projects=state.projects.filter(p=>p.id!==id);$('#editor').close();editingProject=null;touch();toast('Projeto excluído.')}}else if(action==='delete-entry'){if(confirm('Excluir este registro? Horas, despesas e indicadores serão recalculados.')){const p=projectById(entryContext.pid);p[entryContext.collection]=p[entryContext.collection].filter(x=>x.id!==entryContext.id);$('#entryEditor').close();entryContext=null;touch();if(editingProject)paintProjectEditor()}}else if(action==='prev-week'||action==='next-week'){week=addDays(week,action==='prev-week'?-7:7);render()}else if(action==='json-export')exportJSON();else if(action==='json-import'){if(!demo)$('#jsonInput').click();else toast('Saia da demonstração para importar.')}else if(action==='csv')csvExport();else if(action==='demo')toggleDemo();else if(action==='recover'){state=cacheCandidate;cacheCandidate=null;dirtyFile=true;selected='all';render();toast('Alterações recuperadas. Ative a gravação ou baixe o HTML atualizado.')}else if(action==='discard-recovery'){if(confirm('Manter os dados do HTML e descartar a recuperação local mais recente?')){cacheCandidate=null;try{localStorage.setItem(storageKey(),JSON.stringify(state))}catch(e){cacheOk=false}render()}}
});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const cursor=ev.target.selectionStart;search=ev.target.value;render();$('#search').focus();$('#search').setSelectionRange(cursor,cursor);return}handleField(ev)});
document.addEventListener('change',ev=>{const e=ev.target;if(e.id==='projectScope'){selected=e.value;render()}else if(e.id==='statusFilter'){statusFilter=e.value;render()}else if(e.id==='weekFilter'&&e.value){week=monday(e.value);render()}else if(e.id==='entryProject'){if(!validateEditorFields($('#entryForm')))return;week=projectById(entryContext.pid).updates.find(x=>x.id===entryContext.id).week;openEntry('week',e.value)}else if(e.dataset.toggleMilestone){const m=projectById(editingProject).milestones.find(x=>x.id===e.dataset.toggleMilestone);m.done=e.checked;touch();paintProjectEditor()}else if(e.id==='jsonInput'){importJSON(e.files[0])}else if(e.name==='week'&&e.checkValidity()&&e.value)e.value=monday(e.value)});
$('#editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});$('#entryEditor').addEventListener('cancel',e=>{e.preventDefault();closeEntry()});
window.addEventListener('beforeunload',e=>{if(!demo&&(writing||dirtyFile)){e.preventDefault();e.returnValue=''}});
window.addEventListener('storage',e=>{if(!demo&&e.key===storageKey()&&e.newValue){try{const other=validateState(JSON.parse(e.newValue));if(other.revision>state.revision){clearTimeout(writeTimer);fileHandle=null;cacheCandidate=other;$('#editor').close();$('#entryEditor').close();editingProject=null;entryContext=null;render();toast('Outra aba alterou esta base. Recupere a versão mais recente antes de editar.')}}catch(err){}}});
render();
